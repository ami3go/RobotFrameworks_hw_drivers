  "test_templates": [
    {
      "name": "DUT Functional Test At Stable Temperature",
      "preconditions": [
        "${CHAMBER_IP} resolved",
        "${SAFE_MIN}/${SAFE_MAX} approved",
        "DUT fixture and power configured",
        "Emergency procedure available"
      ],
      "workflow": [
        "Connect Climate Chamber    ip=${CHAMBER_IP}    temperature_min=${SAFE_MIN}    temperature_max=${SAFE_MAX}",
        "Set Temperature And Wait    target=${TARGET}    tolerance=${TOLERANCE}    stable_samples=3    timeout=${TIMEOUT}",
        "DUT_DRIVER.Execute Verification",
        "REFERENCE_TEMPERATURE_DRIVER.Measure Temperature",
        "Stop And Disconnect Climate Chamber"
      ],
      "oracle": "DUT requirements pass and independent temperature is within approved tolerance.",
      "risk_level": "HIGH"
    }
  ],
  "bench_constraints": {
    "operator_actions": [
      "Confirm chamber is empty of personnel and door is secured.",
      "Confirm DUT, fixture, cables, batteries, and materials are rated for target.",
      "Confirm condensation/dew-point strategy when crossing cold temperatures.",
      "Confirm safe access temperature before opening after test."
    ],
    "safety_zones": [
      {
        "name": "CHAMBER_INTERIOR",
        "hazards": [
          "HOT_SURFACE",
          "COLD_SURFACE",
          "CONDENSATION",
          "MOVING_AIR"
        ],
        "access": "OPERATOR_PROCEDURE_REQUIRED"
      }
    ],
    "maximum_simultaneous_operations": 1,
    "environmental_limits": {
      "minimum_degC": "UNKNOWN",
      "maximum_degC": "UNKNOWN",
      "dut_safe_minimum_degC": "UNKNOWN",
      "dut_safe_maximum_degC": "UNKNOWN"
    }
  },
  "scheduling_rules": {
    "resource_conflicts": [
      "Only one workflow may own CHAMBER_VOLUME.",
      "Do not run multiple temperature transitions in parallel."
    ],
    "driver_ordering": [
      "Configure DUT safe state before chamber start.",
      "Reach stable temperature before dependent DUT measurement.",
      "Stop chamber before disconnect when safe teardown is requested."
    ],
    "stabilization_rules": [
      "Use at least three consecutive samples for production verification unless requirement specifies otherwise.",
      "Use independent reference temperature for traceable accuracy decisions."
    ],
    "parallel_execution_limits": {
      "chamber_control": 1,
      "dut_measurements_inside_same_stable_dwell": "ALLOWED_IF_RESOURCES_DO_NOT_CONFLICT"
    }
  },
  "global_safety": {
    "forbidden_sequences": [
      [
        "Disconnect Climate Chamber",
        "Assume Chamber Stopped"
      ],
      [
        "Stabilization Timeout",
        "Open Chamber Door"
      ],
      [
        "Unknown DUT Temperature Rating",
        "Start Climate Chamber"
      ]
    ],
    "emergency_shutdown_workflow": [
      "Attempt Stop Climate Chamber if communication is available.",
      "Use chamber local emergency stop or laboratory isolation when software control is unavailable.",
      "Remove DUT power through the approved bench emergency path when safe.",
      "Verify actual chamber running state and safe access temperature locally.",
      "Do not open chamber until laboratory procedure permits access."
    ],
    "control_authorization": "DENIED_WHILE_ANY_CRITICAL_FIELD_IS_UNKNOWN"
  },
  "open_questions": [
    "CHAMBER_IP",
    "Chamber model and firmware",
