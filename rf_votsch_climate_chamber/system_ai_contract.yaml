        "from": "CHAMBER.CHAMBER_VOLUME",
        "to": "DUT.AMBIENT",
        "signal": "AMBIENT_TEMPERATURE"
      },
      {
        "from": "CHAMBER.CHAMBER_VOLUME",
        "to": "REFERENCE_SENSOR.SENSING_ELEMENT",
        "signal": "AMBIENT_TEMPERATURE"
      },
      {
