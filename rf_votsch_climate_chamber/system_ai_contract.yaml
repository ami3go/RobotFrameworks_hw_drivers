      {
        "id": "CHAMBER",
        "type": "CLIMATE_CHAMBER",
        "model": "UNKNOWN",
        "network_endpoint": "${CHAMBER_IP}:2049"
      },
      {
        "id": "DUT",
        "type": "DEVICE_UNDER_TEST",
        "model": "UNKNOWN",
        "location": "INSIDE_CHAMBER_VOLUME"
      },
      {
        "id": "REFERENCE_SENSOR",
        "type": "TEMPERATURE_REFERENCE",
        "model": "UNKNOWN",
        "location": "NEAR_DUT"
      }
    ],
    "links": [
