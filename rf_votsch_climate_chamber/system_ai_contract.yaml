      "producer": "REFERENCE_SENSOR",
      "signal": "REFERENCE_TEMPERATURE",
      "consumers": [
        "TEST_ORACLE"
      ],
      "unit": "degC"
    },
    {
      "producer": "DUT_DRIVER",
      "signal": "DUT_TELEMETRY",
      "consumers": [
        "TEST_ORACLE"
      ],
      "unit": "MODEL_DEPENDENT"
    }
