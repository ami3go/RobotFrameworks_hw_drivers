    "release_version": "v26.02",
    "pep440_version": "26.2",
    "manufacturer": "Vötsch / Weiss Technik",
    "instrument_class": "CLIMATE_CHAMBER",
    "primary_role": "ENVIRONMENTAL_TEMPERATURE_CONTROL",
    "supported_models": [
      "SimServ-compatible Vötsch/Weiss chambers using the documented TCP protocol"
    ],
    "supported_firmware": [
      "UNKNOWN"
    ],
    "transport": "TCP",
    "default_port": 2049
  },
  "mental_model": {
    "physical_object": "One environmental chamber whose internal controller exposes setpoint, measured temperature, running state, gradients, and auxiliary digital outputs over TCP.",
    "configuration_persistence": "Chamber setpoint, gradients, running state, and auxiliary outputs are instrument state and may survive driver disconnect; local software safety limits exist only in the library instance.",
    "blocking_behavior": "Queries and control writes are synchronous. Stabilization and dwell keywords block until success or finite timeout.",
    "resource_ownership": "One SUITE-scoped library instance owns at most one TCP session and serializes driver operations.",
    "concurrency": "Do not issue concurrent control keywords through the same instance. Bench planners must treat environmental control as an exclusive shared resource.",
    "measurement_semantics": "Get Climate Chamber Temperature reports the chamber internal control sensor, not an independent calibrated DUT reference."
  },
  "state_machine": {
    "initial_state": "DISCONNECTED",
    "states": {
      "DISCONNECTED": "No retained driver session.",
      "CONNECTED": "A verified TCP session exists. Chamber running state is a separate physical attribute.",
      "BUSY": "A blocking stabilization, dwell, start, or stop operation is executing.",
      "ERROR": "Communication or physical state is uncertain and must be re-verified."
    },
    "transitions": [
      {
        "from": "DISCONNECTED",
        "keyword": "Connect Climate Chamber",
        "to": "CONNECTED"
      },
      {
        "from": "CONNECTED",
        "keyword": "Disconnect Climate Chamber",
        "to": "DISCONNECTED"
      },
      {
        "from": "CONNECTED",
        "keyword": "Stop And Disconnect Climate Chamber",
        "to": "DISCONNECTED"
      },
      {
        "from": "ERROR",
        "keyword": "Reconnect Climate Chamber",
        "to": "CONNECTED"
      },
      {
        "from": "CONNECTED",
        "keyword": "Set Temperature And Wait",
        "to": "BUSY",
        "on_return": "CONNECTED"
      },
      {
        "from": "CONNECTED",
        "keyword": "Wait Until Climate Chamber Is Stable",
        "to": "BUSY",
        "on_return": "CONNECTED"
      },
      {
        "from": "CONNECTED",
        "keyword": "Wait For Climate Chamber Dwell",
        "to": "BUSY",
        "on_return": "CONNECTED"
      }
    ]
  },
  "resources": {
    "consumed": [
      {
        "name": "LAN_ENDPOINT",
        "type": "NETWORK",
        "exclusive": false,
        "description": "Reachable chamber IP/hostname and TCP port."
      },
      {
        "name": "CLIMATE_CHAMBER_TCP_SESSION",
        "type": "SESSION",
        "exclusive": true,
        "description": "One TCP protocol session owned by one library instance."
      },
      {
        "name": "CLIMATE_CHAMBER_ENVIRONMENT_CONTROL",
        "type": "PHYSICAL_ENVIRONMENT",
        "exclusive": true,
        "description": "Chamber volume, temperature controller, gradients, dryer, and compressed-air outputs."
      }
    ],
    "provided": [
      {
        "name": "CONTROLLED_TEMPERATURE_ENVIRONMENT",
        "type": "ENVIRONMENTAL_SIGNAL",
        "unit": "degC"
      },
      {
        "name": "CHAMBER_INTERNAL_TEMPERATURE_READING",
        "type": "MEASUREMENT",
        "unit": "degC",
        "quality": "CONTROL_MONITORING_ONLY"
      }
    ]
  },
  "dependencies": {
    "required_software": [
      "Python >=3.10",
      "Robot Framework >=7.4,<8"
    ],
    "required_hardware": [
      "Compatible climate chamber",
      "LAN path to chamber TCP service"
    ],
    "optional_drivers": [
      "Independent calibrated temperature logger for accuracy verification",
      "DUT telemetry driver for functional checks under temperature",
      "Power supply and DMM drivers for environmental electrical tests"
    ],
    "drivers_commonly_before": [
      "Relay/fixture setup driver",
      "DUT power-control driver"
    ],
    "drivers_commonly_after": [
      "DUT communication driver",
      "DMM or DAQ measurement driver"
    ]
  },
  "connection_points": {
    "inputs": [
      {
        "name": "TCP_CONTROL",
        "signal": "ETHERNET_TCP",
        "connector": "RJ45_OR_BENCH_NETWORK",
        "address": "${CHAMBER_IP}:2049"
      }
    ],
    "outputs": [
      {
        "name": "CHAMBER_VOLUME",
