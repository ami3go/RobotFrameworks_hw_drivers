name: Feature request
description: Propose a safe, testable improvement
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: use_case
    attributes:
      label: Hardware-test use case
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Proposed keyword or driver behavior
    validations:
      required: true
  - type: textarea
    id: safety
    attributes:
      label: Safety and compatibility impact
    validations:
      required: true
