name: CI
on: [push, pull_request]
jobs:
  test:
    strategy: {matrix: {os: [ubuntu-latest, windows-latest], python: ['3.11','3.12','3.13']}}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '${{ matrix.python }}'}
      - run: python -m pip install -e .[dev]
      - run: python scripts/generate_rfds_metadata.py
      - run: python scripts/validate_structure.py
      - run: python scripts/validate_ai_contract.py
      - run: python scripts/validate_call_protocol_conformance.py
      - run: python -m ruff check rf_votsch_climate_chamber tests scripts
      - run: python -m mypy rf_votsch_climate_chamber
      - run: python -m pytest --cov=rf_votsch_climate_chamber --cov-branch
      - run: python scripts/run_conformance.py
