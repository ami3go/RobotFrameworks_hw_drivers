[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "robotframework-votsch-climate-chamber"
version = "26.2"
description = "Production-oriented Robot Framework library and Python driver for Vötsch climate chambers"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "Project contributors"}]
keywords = ["robotframework", "climate-chamber", "votsch", "test-automation", "hardware-testing"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Framework :: Robot Framework",
  "Intended Audience :: Developers",
  "Intended Audience :: Manufacturing",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Testing",
]
dependencies = ["robotframework>=7.4,<8"]

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.12",
  "mypy>=1.15",
  "twine>=6",
]

docs = [
  "mkdocs>=1.6",
  "mkdocs-material>=9.6",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["votsch_climate_chamber*"]

[tool.setuptools.package-data]
votsch_climate_chamber = ["py.typed"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests/unit"]
markers = ["hardware: requires a real climate chamber"]

[tool.coverage.run]
branch = true
source = ["votsch_climate_chamber"]

[tool.coverage.report]
show_missing = true
fail_under = 85
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true

[tool.setuptools.data-files]
"share/rf_votsch_climate_chamber/ai" = ["ai/ai_contract.yaml", "ai/ai_contract.lock", "ai/README.md"]
"share/rf_votsch_climate_chamber" = ["system_ai_contract.yaml"]
