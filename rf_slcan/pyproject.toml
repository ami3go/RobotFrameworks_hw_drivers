[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "robotframework-slcan"
version = "26.2"
description = "Robot Framework driver for SLCAN (serial-line CAN) interface adapters"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "robotframework>=7.0,<9",
]

[project.optional-dependencies]
serial = ["pyserial>=3.5"]
dev = [
  "pytest>=8,<10",
  "pytest-cov>=5,<8",
  "ruff>=0.6,<1",
  "mypy>=1.11,<2",
  "build>=1,<2",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["rf_slcan*", "slcan*"]
exclude = ["tests*", "examples*", "task*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
