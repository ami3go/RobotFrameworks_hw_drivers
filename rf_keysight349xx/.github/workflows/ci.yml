name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install -e '.[dev]'
      - run: python scripts/validate_structure.py
      - run: python scripts/validate_ai_contract.py
      - run: python scripts/validate_public_api.py
      - run: python scripts/validate_call_protocol_conformance.py
      - run: python -m unittest discover -s tests/unit -p 'test_*.py' -v
      - run: python -m robot --outputdir results/robot tests/robot/smoke.robot
