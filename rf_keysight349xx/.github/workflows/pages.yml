name: Pages
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["docs/**", "mkdocs.yml"]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install mkdocs
      - run: mkdocs build --strict
