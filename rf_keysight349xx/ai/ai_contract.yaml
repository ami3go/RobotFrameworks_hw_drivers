- DriverValidationError
- DriverStateError
- DriverConnectionError
- DriverTimeoutError
- DriverProtocolError
- DriverResponseError
- DriverDeviceError
- DriverNotSupportedError
- DriverConcurrencyError
safety_rules:
- No raw I/O, calibration, reset, switching, DAC, or digital-output API in D0.
- 'Simulation requires explicit SIM:: resource.'
- No hardware I/O on import or construction.
verification_objectives:
- public API synchronization
- exact protocol vectors
- strict parser failure behavior
- zero-I/O import
setup_teardown_contract:
  setup: Construct library then Connect explicitly.
  teardown: Disconnect or Disconnect All.
limitations:
- RFDS-019 runtime NOT_RUN
- HIL NOT_RUN
- measurement/switching/temperature deferred
- DEV-RFDSCORE-001 open
planning_hints:
- Discover modules after Connect before planning module-dependent operations.
- Do not invent absent measurement/switching keywords.
unknown_handling:
  policy: Keep unsupported behavior explicit; never invent commands.
  items:
  - continuity_measurement
  - diode_measurement
  - bench_specific_safe_states
conformance_rules:
  public_api: api/public_api.yaml
  rfds019_inventory: tests/conformance/data/keyword_inventory.yaml
  protocol_vectors: tests/conformance/data/protocol_vectors.yaml
  runtime_status: NOT_RUN
  hardware_status: NOT_RUN
