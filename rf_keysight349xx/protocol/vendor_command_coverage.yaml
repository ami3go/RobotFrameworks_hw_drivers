# Vendor Command Coverage — Keysight 34970A/34972A
#
# RFDS spec §20. Every command the vendor reference declares carries an explicit disposition.
#
# EXTRACTION METHOD (v1.7): commands are read from each block's own Syntax section,
# which is where the reference declares the exact command forms.
#
# The v1.6 map extracted block *titles* and claimed 193 commands at 100% coverage.
# That was wrong: one block documents several commands, and the generator asserted
# the map against its own extractor output, which is circular. See
# task/ARTIFACT_REVIEW_v1.6.md findings R1 and R2.
#
# EXTRACTION IS RECONCILED FROM TWO INDEPENDENT SOURCES (v1.9):
#   A. per-block Syntax sections                      -> 347 commands
#   B. the reference Commands A-Z index (line 14158)  -> 342 commands
#
# Neither is a superset of the other. Method A missed the four RTD/FRTD
# OCOMpensated forms; method B missed 12 colon-free commands (ABORt, FETCh?,
# INITiate, CONFigure?, DISPlay, CALibration?, [SENSe:]FUNCtion, ...).
# The set below is their reconciled union. Every A/B discrepancy was resolved
# to a real command or a documented notation artifact -- the latter being
# abbreviated aliases (SYST:LFRequency?) and optional-node bracket differences
# (SYSTem:SECurity[:IMMediate] vs SYSTem:SECurity:IMMediate).
#
# KNOWN LIMIT: completeness is asserted only against these two extractions.
# A third method may still find more. That is why RFDS spec §9.2 requires
# reconciliation of at least two extractions rather than a single one.
#
# Commands dispositioned : 351
#
# Status counts:
#   PUBLIC       272
#   EXCLUDED     39
#   INTERNAL     24
#   UNKNOWN      12
#
# Distinct planned keywords: 121

