  - keyword: Set Load Setpoint
    signature: "Set Load Setpoint    mode    value"
    purpose: Write the regulation level belonging to one mode (commands 0x2A, 0x2C, 0x2E, 0x30).
    inputs:
      mode: {type: string, allowed: [CC, CV, CW, CR]}
      value: {type: float, unit: "A for CC, V for CV, W for CW, ohm for CR", range: "0 to the model rating; CR is limited to 0.1 .. 4000 ohm"}
    outputs: {type: none}
    preconditions: [State is REMOTE_IDLE or REMOTE_ACTIVE.]
    postconditions: [That mode's setpoint register holds the value, quantised to the instrument resolution (0.1 mA, 1 mV, 1 mW, 1 mohm).]
    side_effects: [If the input is closed and this mode is active, the load on the DUT changes immediately.]
    risk_level: medium
    timing: {typical_ms: 60, worst_case_ms: 1000}
    stabilization_delay_s: 0.05
    retry_policy: *retry_transport
    errors: [BK8500ValidationError, BK8500CommandError, BK8500ConnectionError]
    exclusive_resources: [instrument]

  - keyword: Get Load Setpoint
    signature: "Get Load Setpoint    mode"
