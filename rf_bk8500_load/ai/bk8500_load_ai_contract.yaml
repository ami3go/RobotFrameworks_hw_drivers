  - keyword: Configure Load List
    signature: "Configure Load List    mode    steps    repeat=ONCE    name=None"
    purpose: Program a complete list sequence (commands 0x3A, 0x3C, 0x3E and the per-step 0x40/0x42/0x44/0x46, plus 0x48).
    inputs:
      mode: {type: string, allowed: [CC, CV, CW, CR]}
      steps: {type: "list of (level, dwell_seconds) pairs", min_length: 2, max_length: 1000, note: "Step indices are 1-based. Physical BK8500 model 8500 firmware 1.84 rejected command 0x3E for a one-step list; this driver therefore requires at least two steps. Effective maximum follows partition: 1x1000, 2x500, 4x250, or 8x120."}
      repeat: {type: string, allowed: [ONCE, REPEAT], default: ONCE}
      name: {type: string, max_length: 10, optional: true, note: ASCII only.}
    outputs: {type: none}
    preconditions: [State is REMOTE_IDLE., The profile contains at least two steps., The list partition allows the requested number of steps.]
    postconditions: [The list is resident in volatile memory. Use Save Load List File to persist it., "Validation is all-or-nothing: partition capacity, every step and the list name are checked before the first list-write frame is sent."]
    side_effects: [The driver forces the load input OFF before list editing., "Programming is one transaction per step: a 1000 step list takes roughly a minute at 9600 baud."]
    risk_level: low
    timing: {typical_ms: 60, worst_case_ms: 1000, note: per step}
    stabilization_delay_s: 0
    retry_policy: *retry_transport
    errors: [BK8500ValidationError, BK8500CommandError]
    exclusive_resources: [instrument]

