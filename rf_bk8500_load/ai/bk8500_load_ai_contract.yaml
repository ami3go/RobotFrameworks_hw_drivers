    preconditions: [A connection is open.]
    postconditions: [State is LOCAL., Input is open., Function is FIXED., The LOCAL key is enabled.]
    side_effects: [Sends 0x20(1), 0x21(0), 0x5D(0), 0x55(1), 0x20(0) in that order.]
