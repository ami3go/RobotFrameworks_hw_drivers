%YAML 1.2
---
# RFDS-017 AI Driver Contract, specification version 3.0
# Driver: bk8500_load / BK8500Library
# This file is the machine-readable source of truth. An AI planner must be able
# to generate correct Robot Framework tests from this file alone, without
# reading the driver source.

contract:
  rfds: RFDS-017
  specification_version: "3.0"
  contract_revision: 12
  generated_for_driver_version: "26.16.0"
  lifecycle: {phase: 1, gate: 5, package: bk8500_load}

identity:
  driver_name: bk8500_load
  package_name: rf_bk8500_load
  package_release: 16
  package_file: rf_bk8500_load_v26.16.zip
  robot_library_name: BK8500Library
  library_scope: GLOBAL
  version: "26.16.0"
  lifecycle_version: "26.01.05"
  maintenance_revision: 11
  instrument_family: B&K Precision 8500 series DC electronic load
  supported_models: [8500, 8502, 8510, 8512, 8514, 8518, 8520, 8522, 8524, 8526]
  instrument_class: electronic_load
  role_on_bench: sink
  interface:
    physical: Rear panel DB9 carrying TTL levels, reached through the vendor's IT-E132B USB-to-TTL adapter
    framing: fixed 26 byte binary
    baud_rates: [4800, 9600, 19200, 38400]
    data_bits: 8
    parity: none
    stop_bits: 1
    flow_control: none
    signal_lines: >
      DTR and RTS must be asserted. The adapter takes part of its interface
      enable from them; with either line low the link is silent and every
      transaction times out with no error from the instrument. The driver
      asserts both explicitly on open and verifies the result rather than
      relying on the serial library's platform-dependent default.
    hardware_warning: >
      The DB9 is TTL, not RS-232. Connecting it to a standard RS-232 port can
      damage the instrument. Use the IT-E132B or an equivalent level shifter.
  protocol_reference: 8500 Series user manual, chapter "Remote operation", firmware command set 0x12..0x6B
  units: {voltage: V, current: A, power: W, resistance: ohm, time: s}
  import_examples:
    hardware: "Library    BK8500Library    port=/dev/ttyUSB0    baudrate=9600    model=8500"
    hardware_auto_baud: "Library    BK8500Library    port=/dev/ttyUSB0    baudrate=AUTO    model=8500"
    simulated: "Library    BK8500Library    simulated=${TRUE}    model=8500"


verification:
  latest_physical_hardware_run:
    evidence_date: "2026-07-28"
    driver_version_tested: "26.14.0"
    installed_distribution_version: "26.14.0"
    result: PASS
    tests: {total: 56, passed: 56, failed: 0, public_keyword_tests: 55, workflow_tests: 1}
    host: Windows-11-10.0.22631-SP0
    python_version: "3.13.5"
    robot_framework_version: "7.4.2"
    transport: {port: COM12, baudrate: 9600, address: 0}
    device: {model: "8500", serial_number: "1687710135", firmware_version: "1.84"}
    evidence_path: evidence/hardware_conformance/v26.14_com12_2026-07-28
    confirmed:
      - all exported public Robot Framework keywords are callable on the physical device
      - the save, reconfigure and recall list workflow passes
      - the echo-aware serial opening and response path returns a valid identity
      - suite safe teardown passes
    scope_limit: >
      This run does not include per-keyword raw TX/RX trace files, protocol-vector
      results, or injected malformed-response and timeout recovery evidence.
      It therefore does not alone close RFDS-019 Levels 2 through 4.
  release_26_15:
    change_type: documentation_and_evidence
    functional_core: unchanged_from_26_14
    relationship: >
      Release 26.15 updates package metadata and all current documentation around
      the passing v26.14 hardware baseline. Protocol, transport, driver and Robot
      keyword behaviour are unchanged.
  release_26_16:
    change_type: connection_feature
    feature: automatic_baud_rate_detection
    status: simulator_and_unit_verified_physical_confirmation_pending
    relationship: >
      Release 26.16 retains the verified v26.14 protocol path and adds optional
      read-only baud probing. Numeric baud with auto detection disabled preserves
      the previous deterministic connection behaviour.

interpretation_notes:
  stabilization_delay_s: >
    The delay each capability declares is applied by the driver itself after
    the command completes. A planner does not need to insert its own sleep for
    it, and should not subtract it from a measurement budget twice. The
    behaviour can be switched off with apply_stabilization_delays=False on the
    driver, in which case the declared delays become the planner's
    responsibility.
  reply_framing: >
    Write commands must return a 0x12 status frame. Some USB-to-TTL paths first
    produce an exact local echo of the transmitted write packet; releases 26.14+
    discard that echo and continue waiting for the real device status within
    the original timeout budget. An echo without a following device response is
    a transport failure, not command success. Read commands are answered either
    with the request command byte or with a status-tagged data frame; the driver
    records the observed data-reply style.
  serial_open_sequence: >
    Create the serial object closed, request DTR and RTS high, open the selected
    port, reassert both lines, wait 1.0 second, then clear buffers. This sequence
    matches the verified COM12 bench script and avoids platform-specific line
    state changes during open.
  baud_rate_detection: >
    Automatic detection tries the requested numeric rate first, then the unique
    supported candidates. Every attempt uses only the product-information query
    0x6A. Exact echo, malformed or empty identity and timeout are failures. By
    default two consecutive identities must match. Failed ports are closed before
    the next rate and the successful port remains open at the detected rate.
  persistence_settle: >
    EEPROM save/recall replies can arrive before firmware is ready for the next
    list or settings edit. The driver applies 0.5 s after saves and 0.2 s after
    recalls. Do not issue a parallel command on the same instrument during this
    barrier. This timing was added from the physical COM9 conformance result.

mental_model:
  summary: >
    A programmable current sink. The instrument sits across a source under test
    and draws a controlled current, voltage, power or resistance from it. The
    driver never produces energy; every risk it carries is the risk of drawing
    too much from the device under test, or of leaving the input closed when a
    test ends.
  key_concepts:
    - name: control_ownership
      description: >
        The front panel and the bus compete for control. Command 0x20 claims
        remote control; until it is claimed, setting commands may be rejected
        and the input cannot be closed by this driver.
    - name: mode
      description: >
        The regulation law, one of CC (constant current), CV (constant voltage),
        CW (constant power) or CR (constant resistance). Each mode owns its own
        setpoint register; changing mode does not clear the others.
    - name: function
      description: >
        What the load does with the mode: FIXED holds the setpoint, TRANSIENT
        toggles between two levels, LIST plays a programmed sequence, BATTERY
        discharges to a cut-off voltage, SHORT applies the maximum sink current.
    - name: input_state
      description: >
        The input relay. Everything else is configuration; only the input state
        determines whether current actually flows.
    - name: protection_limits
      description: >
        Instrument-side maximum voltage, current and power. They are independent
        of the setpoint and survive mode changes. They are the last line of
        defence and are set once during setup, not per measurement.
  measurement_capability:
    provides: [dc_voltage_at_load_terminals, dc_sink_current, dc_input_power, protection_state]
    sample_rate: single-shot on request, roughly 10..30 readings per second at 9600 baud
    is_synchronous: true
    notes: >
      A reading is one 0x5F transaction. There is no buffered acquisition and no
      timestamping, so this instrument is not a substitute for a scope or a DAQ
      when microsecond timing matters.

state_machine:
  states:
    - {name: DISCONNECTED, description: No serial port open. Only Open Load Connection is legal.}
    - {name: LOCAL, description: Port open, instrument under front panel control. Reads are legal, the input cannot be closed by the driver.}
    - {name: REMOTE_IDLE, description: Remote control claimed, input open. All configuration is legal here.}
    - {name: REMOTE_ACTIVE, description: Remote control claimed, input closed, current flowing.}
    - {name: FAULT, description: The instrument reports a protection bit (reverse polarity, OV, OC, OP, OT).}
  initial_state: DISCONNECTED
  transitions:
    - {from: DISCONNECTED, to: LOCAL, keyword: Open Load Connection}
    - {from: LOCAL, to: REMOTE_IDLE, keyword: Claim Remote Control}
    - {from: REMOTE_IDLE, to: REMOTE_ACTIVE, keyword: Load Input On}
    - {from: REMOTE_ACTIVE, to: REMOTE_IDLE, keyword: Load Input Off}
    - {from: REMOTE_ACTIVE, to: FAULT, event: instrument asserts a demand-state protection bit}
    - {from: FAULT, to: REMOTE_IDLE, keyword: Load Input Off, note: The fault cause must be removed before the input is closed again.}
    - {from: REMOTE_IDLE, to: LOCAL, keyword: Release Remote Control}
    - {from: any, to: DISCONNECTED, keyword: Close Load Connection, note: Performs the safe-state sequence first unless safe=False.}
  invariants:
    - The driver refuses Load Input On unless remote control was claimed in this session.
    - Every keyword that changes a setting is legal only in REMOTE_IDLE or REMOTE_ACTIVE.
    - Changing mode, function or setpoint while in REMOTE_ACTIVE changes the load on the DUT immediately.
  state_observability:
    keyword: Measure Load Input
    fields: {input_on: operation_state bit 3, remote_control_enabled: operation_state bit 2, active_protections: demand_state bits 0..4}

resources:
  consumed:
    - {type: serial_port, identifier: constructor argument "port", exclusive: true, notes: One driver instance per physical port. The 26 byte protocol has no framing recovery, so two writers on one port corrupt each other.}
    - {type: instrument, identifier: "model + serial number", exclusive: true, notes: The instrument accepts one controller at a time.}
    - {type: dut_electrical_node, identifier: bench-defined, exclusive: true, notes: The load's input terminals must be the only sink on that node unless the bench contract says otherwise.}
  provided:
    - {type: measurement, quantity: dc_voltage, node: load_input_terminals, accuracy: "±(0.02% + 0.025% FS)", resolution: 1 mV below 18 V, 10 mV above}
    - {type: measurement, quantity: dc_current, node: load_input_terminals, accuracy: "±(0.2% + 0.15% FS)", resolution: 0.1 mA in the low range, 1 mA in the high range}
    - {type: measurement, quantity: dc_power, node: load_input_terminals, accuracy: "±(1% + 0.1% FS)", resolution: 1 mW below 100 W, 100 mW above}
    - {type: stimulus, quantity: controlled_sink_current, node: load_input_terminals}
  not_provided: [source_capability, ac_measurement, waveform_capture, timestamped_streaming]

dependencies:
  python: ">=3.9"
  packages: [{name: pyserial, version: ">=3.4", required_for: SerialTransport only}, {name: robotframework, version: ">=6.0", required_for: keyword layer}]
  operating_system_notes: >
    On Linux the user must belong to the dialout group to open /dev/ttyUSB*.
    On Windows the port is named COMn. The IT-E132B adapter is PL-2303 based
    and needs the Prolific driver installed. Some third-party PL-2303 clones
    and some virtual COM drivers do not raise DTR or RTS on open; the driver
    asserts both and fails with a message naming the line rather than timing
    out silently.
  other_drivers: none
  bench_prerequisites:
    - A source under test connected with the correct polarity. Reverse polarity is detected but is a fault, not a supported configuration.
    - Wiring rated for the intended sink current. The driver cannot detect undersized leads.
    - A TTL-level adapter between the PC and the instrument's DB9. A direct RS-232 connection can damage the instrument.
    - The instrument's front panel baud rate is one of 4800, 9600, 19200 or 38400. A suite may provide it explicitly or enable read-only automatic detection.

capabilities:

  - keyword: Open Load Connection
    signature: "Open Load Connection    port=None    baudrate=9600    model=None    alias=default    address=0    timeout=1.0    simulated=False    identify=True    assert_dtr=True    assert_rts=True    source_voltage=None    source_resistance=None    auto_detect_baudrate=None    baudrate_candidates=None    probe_timeout=None    confirm_baudrate_identity=None"
    purpose: Open a transport to one DC load, optionally detect its baud rate with read-only identity queries, verify identity and make it the current connection.
    inputs:
      port: {type: string, required_when: simulated is False, example: /dev/ttyUSB0}
      baudrate: {type: integer_or_AUTO, allowed: [AUTO, 4800, 9600, 19200, 38400], default: 9600, note: "A numeric rate is deterministic. AUTO enables probing with 9600 preferred. Rates above 38400 are rejected before the port is opened."}
      model: {type: string, optional: true, note: Used for validation limits until the instrument reports its own model.}
      alias: {type: string, default: default, note: Handle for Switch Load Connection.}
      address: {type: integer, range: [0, 254], default: 0}
      timeout: {type: float, unit: s, default: 1.0}
      simulated: {type: boolean, default: false, note: Uses the in-process instrument model; no hardware is touched.}
      identify: {type: boolean, default: true}
      assert_dtr: {type: boolean, default: true, note: "Leave true. The instrument requires DTR asserted; set false only for a documented non-standard adapter."}
      assert_rts: {type: boolean, default: true, note: "Leave true. The instrument requires RTS asserted."}
      source_voltage: {type: float, optional: true, unit: V, applies_when: simulated is true}
      source_resistance: {type: float, optional: true, unit: ohm, applies_when: simulated is true}
      auto_detect_baudrate: {type: boolean, default: false, note: "When true, try the requested numeric baud first and then baudrate_candidates."}
      baudrate_candidates: {type: string_or_list, default: "4800,9600,19200,38400", note: "Candidates are de-duplicated. Unsupported rates fail before any port is opened."}
      probe_timeout: {type: float, unit: s, default: 0.75, range: [0.05, 10.0], note: "Per-transaction timeout used during each baud probe."}
      confirm_baudrate_identity: {type: boolean, default: true, note: "Require two consecutive matching product identities before accepting a rate."}
    outputs: {type: string, description: the alias of the opened connection}
    preconditions:
      - The port exists and is not held by another process.
      - No connection with the same alias is open.
      - The adapter can raise DTR and RTS. With automatic detection disabled, the configured baud rate matches the front panel.
    postconditions: [State is LOCAL., DTR and RTS are asserted., Validation limits follow the model reported by the instrument when identify is true., The selected baud rate and probe-attempt evidence are available through Get Load Connection Info.]
    side_effects: [Opens and closes an OS serial handle for each failed probe., Asserts DTR and RTS and disables hardware and software flow control., "Automatic detection sends only command 0x6A and requires two matching identities by default; it never claims remote control or enables the load input."]
    risk_level: low
    timing: {typical_ms: 120, worst_case_ms: 8000, note: "Worst case includes four baud candidates, one-second serial startup per candidate and probe timeouts."}
    stabilization_delay_s: 0
    retry_policy: &retry_transport {attempts: 3, backoff_s: 0.05, retry_on: [BK8500ProtocolError, BK8500TimeoutError], do_not_retry_on: [BK8500CommandError, BK8500ValidationError, BK8500SafetyError]}
    errors: [BK8500ConfigurationError, BK8500ConnectionError, BK8500TimeoutError, BK8500ProtocolError]
    exclusive_resources: [serial_port, instrument]

  - keyword: Switch Load Connection
    signature: "Switch Load Connection    alias"
    purpose: Make a previously opened load the target of subsequent keywords.
    inputs: {alias: {type: string, required: true}}
    outputs: {type: string, description: the alias that was current before the switch}
    preconditions: [A connection with that alias is open.]
    postconditions: [Subsequent keywords address the selected load.]
    side_effects: [No instrument traffic.]
    risk_level: low
    timing: {typical_ms: 0, worst_case_ms: 1}
    stabilization_delay_s: 0
    retry_policy: &retry_none {attempts: 1, retry_on: []}
    errors: [BK8500ConnectionError]
    exclusive_resources: []

  - keyword: Close Load Connection
    signature: "Close Load Connection    alias=None    safe=True"
    purpose: Return one load to its safe state and release the port.
    inputs: {alias: {type: string, optional: true, default: current connection}, safe: {type: boolean, default: true, note: When false the safe-state sequence is skipped and the input is left as it is.}}
    outputs: {type: none}
    preconditions: []
    postconditions: [State is DISCONNECTED for that alias., Input is open and the front panel is usable when safe is true., "If the closed alias was the current one, no connection is current afterwards: call Switch Load Connection before the next keyword rather than relying on an implicit choice."]
    side_effects: [Sends the safe-state sequence 0x20, 0x21, 0x5D, 0x55, 0x20., Closes the OS port handle.]
    risk_level: low
    timing: {typical_ms: 250, worst_case_ms: 3000}
    stabilization_delay_s: 0
    retry_policy: *retry_transport
    errors: [BK8500ConnectionError]
    exclusive_resources: []

  - keyword: Close All Load Connections
    signature: "Close All Load Connections    safe=True"
    purpose: Suite teardown. Safe-state and close every open load.
    inputs: {safe: {type: boolean, default: true}}
    outputs: {type: none}
    preconditions: []
    postconditions: [No connection remains open.]
    side_effects: [As Close Load Connection, once per open alias.]
    risk_level: low
    timing: {typical_ms: 250, worst_case_ms: 3000, note: per open connection}
    stabilization_delay_s: 0
    retry_policy: *retry_transport
    errors: []
    exclusive_resources: []

  - keyword: Connect
    signature: "Connect    resource=None    alias=default    timeout_s=None"
    purpose: RFDS-002 generic connect. Idempotent wrapper over Open Load Connection; resource is the serial port.
    inputs: {resource: {type: string, optional: true}, alias: {type: string, default: default}, timeout_s: {type: float, unit: s, optional: true}}
    outputs: {type: dictionary, keys: [alias, resource, connected, communication_ok, transport, identity, timeout_s, state], note: "RFDS-002 Section 12.1 normalized connection-state dictionary."}
    preconditions: [The port exists and is not held by another process, unless simulated is passed via extra options.]
    postconditions: [State is LOCAL for a freshly opened alias; unchanged when the alias was already connected to the same resource.]
    side_effects: [As Open Load Connection, unless the alias is already connected to the requested resource.]
    risk_level: low
    timing: {typical_ms: 120, worst_case_ms: 8000}
    stabilization_delay_s: 0
    retry_policy: *retry_transport
    errors: [BK8500ConfigurationError, BK8500ConnectionError, BK8500TimeoutError, BK8500ProtocolError]
    exclusive_resources: [serial_port, instrument]

  - keyword: Disconnect
    signature: "Disconnect    alias=None"
    purpose: RFDS-002 generic disconnect. Idempotent wrapper over Close Load Connection; succeeds even if already disconnected.
    inputs: {alias: {type: string, optional: true, default: current connection}}
    outputs: {type: none}
    preconditions: []
    postconditions: [State is DISCONNECTED for that alias, if it was open.]
    side_effects: [As Close Load Connection when the alias is open; no effect otherwise.]
    risk_level: low
    timing: {typical_ms: 250, worst_case_ms: 3000}
    stabilization_delay_s: 0
    retry_policy: *retry_transport
    errors: []
    exclusive_resources: []

  - keyword: Is Connected
    signature: "Is Connected    alias=None"
    purpose: RFDS-002 generic connection query. Returns a boolean rather than raising when no session exists.
    inputs: {alias: {type: string, optional: true, default: current connection}}
    outputs: {type: boolean}
    preconditions: []
    postconditions: [No state change.]
    side_effects: [No instrument traffic.]
    risk_level: none
    timing: {typical_ms: 0, worst_case_ms: 1}
    stabilization_delay_s: 0
    retry_policy: {attempts: 1, retry_on: []}
    errors: []
    exclusive_resources: []

  - keyword: Get Connection State
    signature: "Get Connection State    alias=None    refresh=False"
    purpose: Return the RFDS-002 Section 12.1 normalized connection-state dictionary for one alias.
    inputs: {alias: {type: string, optional: true, default: current connection}, refresh: {type: boolean, default: false}}
    outputs: {type: dictionary, keys: [alias, resource, connected, communication_ok, transport, identity, timeout_s, state]}
    preconditions: []
    postconditions: [No state change.]
    side_effects: [No instrument traffic.]
    risk_level: none
    timing: {typical_ms: 0, worst_case_ms: 1}
    stabilization_delay_s: 0
    retry_policy: {attempts: 1, retry_on: []}
    errors: []
    exclusive_resources: []

  - keyword: Check Communication
    signature: "Check Communication    alias=None"
    purpose: Perform a bounded, non-destructive communication check (reads product information). Raises on failure.
    inputs: {alias: {type: string, optional: true, default: current connection}}
    outputs: {type: boolean}
    preconditions: [A connection is open for the selected alias.]
    postconditions: [No state change.]
    side_effects: [One product-information transaction.]
    risk_level: none
    timing: {typical_ms: 60, worst_case_ms: 1000}
    stabilization_delay_s: 0
    retry_policy: *retry_transport
    errors: [BK8500ConnectionError, BK8500TimeoutError, BK8500ProtocolError]
    exclusive_resources: [serial_port]

  - keyword: Get Identity
    signature: "Get Identity    alias=None    refresh=True"
    purpose: Return a stable human-readable identity string (model, serial number, firmware version).
    inputs: {alias: {type: string, optional: true, default: current connection}, refresh: {type: boolean, default: true}}
    outputs: {type: string}
    preconditions: [A connection is open for the selected alias.]
    postconditions: [No state change.]
    side_effects: [One product-information transaction.]
    risk_level: none
    timing: {typical_ms: 60, worst_case_ms: 1000}
    stabilization_delay_s: 0
    retry_policy: *retry_transport
    errors: [BK8500ConnectionError, BK8500TimeoutError, BK8500ProtocolError]
    exclusive_resources: [serial_port]

  - keyword: Get Load Product Information
    signature: "Get Load Product Information"
    purpose: Read model, serial number and firmware version (command 0x6A).
    inputs: {}
    outputs: {type: dictionary, keys: [model, serial_number, firmware_version, firmware_raw], note: "firmware_raw holds the two undecoded bytes; the manual does not state whether the encoding is hexadecimal or BCD."}
    preconditions: [A connection is open.]
    postconditions: [No state change.]
    side_effects: [One 0x6A transaction.]
    risk_level: none
    timing: {typical_ms: 60, worst_case_ms: 1000}
    stabilization_delay_s: 0
    retry_policy: *retry_transport
    errors: [BK8500ConnectionError, BK8500TimeoutError, BK8500ProtocolError]
    exclusive_resources: [serial_port]

  - keyword: Get Load Rated Limits
    signature: "Get Load Rated Limits"
    purpose: Report the rated envelope the driver validates against, so a planner can size its stimulus.
    inputs: {}
    outputs: {type: dictionary, keys: [model, max_voltage_v, max_current_a, max_power_w]}
    preconditions: [A connection is open.]
    postconditions: [No state change.]
    side_effects: [No instrument traffic; the values come from the driver's model table.]
    risk_level: none
    timing: {typical_ms: 0, worst_case_ms: 1}
    stabilization_delay_s: 0
    retry_policy: *retry_none
    errors: [BK8500ConnectionError]
    exclusive_resources: []

  - keyword: Claim Remote Control
    signature: "Claim Remote Control"
    purpose: Take the instrument out of front panel control (command 0x20, data 1).
    inputs: {}
    outputs: {type: none}
    preconditions: [A connection is open.]
    postconditions: [State is REMOTE_IDLE., Setting keywords and Load Input On become legal.]
    side_effects: [The front panel stops responding except for the LOCAL key., The RMT annunciator lights.]
    risk_level: low
    timing: {typical_ms: 60, worst_case_ms: 1000}
    stabilization_delay_s: 0
    retry_policy: *retry_transport
    errors: [BK8500ConnectionError, BK8500CommandError, BK8500TimeoutError]
    exclusive_resources: [instrument]

  - keyword: Release Remote Control
    signature: "Release Remote Control"
    purpose: Hand the instrument back to the operator (command 0x20, data 0).
    inputs: {}
    outputs: {type: none}
    preconditions: [A connection is open.]
    postconditions: [State is LOCAL.]
    side_effects: [The input state is not changed by this keyword. Open the input first.]
    risk_level: medium
    timing: {typical_ms: 60, worst_case_ms: 1000}
    stabilization_delay_s: 0
    retry_policy: *retry_transport
    errors: [BK8500ConnectionError, BK8500CommandError]
    exclusive_resources: [instrument]

  - keyword: Set Local Key Enabled
    signature: "Set Local Key Enabled    enabled=True"
    purpose: Enable or disable the front panel LOCAL key while under remote control (command 0x55).
    inputs: {enabled: {type: boolean, default: true}}
    outputs: {type: none}
    preconditions: [State is REMOTE_IDLE or REMOTE_ACTIVE.]
    postconditions: [The operator can or cannot recover local control from the panel.]
    side_effects: [Disabling the key removes the operator's manual escape route; the bench emergency stop is then the only manual intervention.]
    risk_level: medium
    timing: {typical_ms: 60, worst_case_ms: 1000}
    stabilization_delay_s: 0
    retry_policy: *retry_transport
    errors: [BK8500ConnectionError, BK8500CommandError]
    exclusive_resources: [instrument]

  - keyword: Load Input On
    signature: "Load Input On"
    purpose: Close the input and start sinking current (command 0x21, data 1).
    inputs: {}
    outputs: {type: none}
    preconditions:
      - Remote control has been claimed in this session, otherwise the driver refuses locally.
      - Mode, setpoint and protection limits are already configured.
      - The DUT is connected with the correct polarity and can supply the programmed load.
    postconditions: [State is REMOTE_ACTIVE., Current flows within the instrument's slew rate.]
    side_effects: [Energy is dissipated in the load., The DUT is loaded immediately with no ramp.]
    risk_level: high
    timing: {typical_ms: 60, worst_case_ms: 1000, note: Electrical settling after the frame is instrument and DUT dependent; allow 50..200 ms before the first reading.}
    stabilization_delay_s: 0.1
    retry_policy: *retry_none
    errors: [BK8500StateError, BK8500CommandError, BK8500ConnectionError]
    exclusive_resources: [instrument, dut_electrical_node]

  - keyword: Load Input Off
    signature: "Load Input Off"
