    stabilization_delay_s: 0.5
    retry_policy: *retry_none
    errors: [BK8500ValidationError, BK8500CommandError]
    exclusive_resources: [instrument]

  - keyword: Recall Load Settings
    signature: "Recall Load Settings    register"
    purpose: Restore settings from a register (command 0x5C).
    inputs: {register: {type: integer, range: [1, 25]}}
    outputs: {type: none}
    preconditions: [State is REMOTE_IDLE., The register was written earlier.]
    postconditions: ["Mode, setpoints and limits are replaced by the stored values."]
    side_effects: ["A recall can silently raise a setpoint or lower a protection limit. Re-read both before closing the input."]
    risk_level: medium
    timing: {typical_ms: 200, worst_case_ms: 2000}
    stabilization_delay_s: 0.1
    retry_policy: *retry_transport
    errors: [BK8500ValidationError, BK8500CommandError]
    exclusive_resources: [instrument]

  - keyword: Measure Load Input
    signature: "Measure Load Input"
    purpose: Take one reading of voltage, current, power and both state registers (command 0x5F).
    inputs: {}
    outputs:
      type: dictionary
      keys: [voltage_v, current_a, power_w, input_on, active_protections, operation_state, demand_state]
      notes: "operation_state and demand_state are name to boolean maps of the two instrument status registers."
    preconditions: [A connection is open.]
    postconditions: [No state change.]
    side_effects: [One 0x5F transaction.]
    risk_level: none
    timing: {typical_ms: 60, worst_case_ms: 1000, note: "Roughly 10 to 30 readings per second at 9600 baud; this is the sampling ceiling for any polling loop built on this driver."}
    stabilization_delay_s: 0
    retry_policy: *retry_transport
    errors: [BK8500ConnectionError, BK8500TimeoutError, BK8500ProtocolError]
    exclusive_resources: [serial_port]

  - keyword: Get Load Voltage
    signature: "Get Load Voltage"
    purpose: Measured terminal voltage.
    inputs: {}
    outputs: {type: float, unit: V}
    preconditions: [A connection is open.]
    postconditions: [No state change.]
    side_effects: [One 0x5F transaction.]
    risk_level: none
    timing: {typical_ms: 60, worst_case_ms: 1000}
    stabilization_delay_s: 0
    retry_policy: *retry_transport
    errors: [BK8500ConnectionError, BK8500ProtocolError]
    exclusive_resources: [serial_port]

  - keyword: Get Load Current
    signature: "Get Load Current"
    purpose: Measured sink current.
    inputs: {}
    outputs: {type: float, unit: A}
    preconditions: [A connection is open.]
    postconditions: [No state change.]
    side_effects: [One 0x5F transaction.]
    risk_level: none
    timing: {typical_ms: 60, worst_case_ms: 1000}
    stabilization_delay_s: 0
    retry_policy: *retry_transport
    errors: [BK8500ConnectionError, BK8500ProtocolError]
    exclusive_resources: [serial_port]

  - keyword: Get Load Power
    signature: "Get Load Power"
    purpose: Measured input power.
    inputs: {}
    outputs: {type: float, unit: W}
    preconditions: [A connection is open.]
    postconditions: [No state change.]
    side_effects: [One 0x5F transaction.]
    risk_level: none
    timing: {typical_ms: 60, worst_case_ms: 1000}
    stabilization_delay_s: 0
    retry_policy: *retry_transport
    errors: [BK8500ConnectionError, BK8500ProtocolError]
    exclusive_resources: [serial_port]

  - keyword: Wait Until Load Reading Is Stable
    signature: "Wait Until Load Reading Is Stable    quantity=current    tolerance=0.01    window=1.0    timeout=10.0    interval=0.1"
    purpose: Block until a measured quantity stays inside a peak-to-peak band for a continuous window.
    inputs:
      quantity: {type: string, allowed: [voltage, current, power]}
      tolerance: {type: float, unit: same as the quantity, note: maximum peak-to-peak spread inside the window}
      window: {type: float, unit: s}
      timeout: {type: float, unit: s}
      interval: {type: float, unit: s, note: "Values below about 0.04 s do not increase the sample rate at 9600 baud."}
    outputs: {type: dictionary, description: the last reading, same shape as Measure Load Input}
    preconditions: [A connection is open.]
    postconditions: [No state change.]
    side_effects: [Occupies the serial port for the duration of the wait.]
    risk_level: none
    timing: {typical_ms: 1000, worst_case_ms: "timeout argument"}
    stabilization_delay_s: 0
    retry_policy: *retry_transport
    errors: [BK8500StateError, BK8500ValidationError, BK8500ProtocolError]
    exclusive_resources: [serial_port]

  - keyword: Load Voltage Should Be Within
    signature: "Load Voltage Should Be Within    expected    tolerance"
    purpose: Pass/fail oracle on the measured terminal voltage.
    inputs: {expected: {type: float, unit: V}, tolerance: {type: float, unit: V, note: absolute, symmetric}}
    outputs: {type: float, description: the measured value, so it can be logged or reused}
    preconditions: [A connection is open., The DUT has settled; combine with Wait Until Load Reading Is Stable for transient-prone sources.]
    postconditions: [No state change.]
    side_effects: [One 0x5F transaction. Raises BK8500VerificationError, which Robot reports as a normal test failure.]
    risk_level: none
    timing: {typical_ms: 60, worst_case_ms: 1000}
    stabilization_delay_s: 0
    retry_policy: *retry_transport
    errors: [BK8500VerificationError, BK8500ProtocolError]
    exclusive_resources: [serial_port]

  - keyword: Load Current Should Be Within
    signature: "Load Current Should Be Within    expected    tolerance"
    purpose: Pass/fail oracle on the measured sink current.
    inputs: {expected: {type: float, unit: A}, tolerance: {type: float, unit: A}}
    outputs: {type: float}
    preconditions: [A connection is open., The load has settled.]
    postconditions: [No state change.]
    side_effects: [One 0x5F transaction.]
    risk_level: none
    timing: {typical_ms: 60, worst_case_ms: 1000}
    stabilization_delay_s: 0
    retry_policy: *retry_transport
    errors: [BK8500VerificationError, BK8500ProtocolError]
    exclusive_resources: [serial_port]

  - keyword: Load Power Should Be Within
    signature: "Load Power Should Be Within    expected    tolerance"
    purpose: Pass/fail oracle on the measured input power.
    inputs: {expected: {type: float, unit: W}, tolerance: {type: float, unit: W}}
    outputs: {type: float}
    preconditions: [A connection is open., The load has settled.]
    postconditions: [No state change.]
    side_effects: [One 0x5F transaction.]
    risk_level: none
    timing: {typical_ms: 60, worst_case_ms: 1000}
    stabilization_delay_s: 0
    retry_policy: *retry_transport
    errors: [BK8500VerificationError, BK8500ProtocolError]
    exclusive_resources: [serial_port]

  - keyword: Load Should Report No Protection Faults
    signature: "Load Should Report No Protection Faults"
    purpose: Fail the test if the instrument asserts reverse polarity, over-voltage, over-current, over-power or over-temperature.
    inputs: {}
    outputs: {type: dictionary, description: the reading that was checked}
    preconditions: [A connection is open.]
    postconditions: [No state change.]
    side_effects: [One 0x5F transaction. Raises BK8500ProtectionError listing the asserted flags.]
    risk_level: none
    timing: {typical_ms: 60, worst_case_ms: 1000}
    stabilization_delay_s: 0
    retry_policy: *retry_transport
    errors: [BK8500ProtectionError, BK8500ProtocolError]
    exclusive_resources: [serial_port]

  - keyword: Load Input State Should Be
    signature: "Load Input State Should Be    expected"
    purpose: Assert that the input relay is in the expected state.
    inputs: {expected: {type: string, allowed: [ON, OFF]}}
    outputs: {type: none}
    preconditions: [A connection is open.]
    postconditions: [No state change.]
    side_effects: [One 0x5F transaction.]
    risk_level: none
    timing: {typical_ms: 60, worst_case_ms: 1000}
    stabilization_delay_s: 0
    retry_policy: *retry_transport
    errors: [BK8500VerificationError, BK8500ProtocolError]
    exclusive_resources: [serial_port]

  - keyword: Load Mode Should Be
    signature: "Load Mode Should Be    expected"
    purpose: Assert the active regulation mode.
    inputs: {expected: {type: string, allowed: [CC, CV, CW, CR]}}
    outputs: {type: none}
    preconditions: [A connection is open.]
    postconditions: [No state change.]
    side_effects: [One 0x29 transaction.]
    risk_level: none
    timing: {typical_ms: 60, worst_case_ms: 1000}
    stabilization_delay_s: 0
    retry_policy: *retry_transport
    errors: [BK8500VerificationError, BK8500ValidationError]
    exclusive_resources: [serial_port]

  - keyword: Get Load Connection Info
    signature: "Get Load Connection Info"
    purpose: Diagnostic. Report the current alias, transport, address, selected baud, probe evidence, limits and all open aliases.
    inputs: {}
    outputs: {type: dictionary, keys: [alias, transport, address, signal_lines, response_style, baudrate, baudrate_auto_detected, baudrate_probe_attempts, limits, open_aliases], note: "signal_lines reports measured DTR/RTS or null for simulation. response_style is echo, status_tagged, or null. baudrate_probe_attempts is empty for deterministic or simulated opens and contains ordered PASS/FAIL evidence after automatic detection."}
    preconditions: [A connection is open.]
    postconditions: [No state change.]
    side_effects: [No instrument traffic.]
    risk_level: none
    timing: {typical_ms: 0, worst_case_ms: 1}
    stabilization_delay_s: 0
    retry_policy: *retry_none
    errors: [BK8500ConnectionError]
    exclusive_resources: []

error_catalogue:
  - id: BK8500ConfigurationError
    meaning: The driver was constructed with an unusable port, model, timeout or baud-probe configuration.
    typical_cause: A baud candidate outside 4800, 9600, 19200 and 38400, invalid timeout, or a typo in the port name.
    recoverable: false
    planner_action: Fix the suite configuration. Do not retry.
  - id: BK8500ConnectionError
    meaning: The port could not be opened, or a keyword was called with no connection open.
    typical_cause: Wrong device path, missing permissions (dialout group), the port is held by another process, an adapter that will not raise DTR or RTS, or Open Load Connection was never called.
    recoverable: false
    planner_action: Fail the suite in setup. Retrying the same port will not help.
  - id: BK8500TimeoutError
    meaning: Fewer than 26 bytes arrived within the timeout.
    typical_cause: "Baud rate mismatch, the instrument is off, the cable is unplugged, the address does not match, or DTR/RTS are not asserted. Check the adapter LEDs: they blink only when frames are actually moving."
    recoverable: sometimes
    planner_action: The driver already retries up to three times, flushing the input buffer before each attempt. If it still fails, check the signal_lines field of Get Load Connection Info before suspecting the instrument.
  - id: BK8500ProtocolError
    meaning: A frame arrived but is malformed, or a data frame was expected and a status frame arrived.
    typical_cause: Line noise, a competing writer on the same port, or a frame boundary lost after a partial read.
    recoverable: true
    planner_action: The driver already retries up to three times. If it still fails, treat the port as unreliable and stop the suite.
  - id: BK8500CommandError
    meaning: The instrument answered with status 0x90, 0xA0, 0xB0 or 0xC0.
    status_map: {0x90: checksum incorrect, 0xA0: parameter out of range, 0xB0: command cannot be carried out in this state, 0xC0: invalid command}
    typical_cause: 0xA0 means the value exceeded the instrument's own limit; 0xB0 usually means remote control was not claimed, or a trigger was sent with the wrong trigger source.
    recoverable: false
    planner_action: Do not retry. Check the precondition list of the keyword that failed.
  - id: BK8500ValidationError
    meaning: The driver rejected a parameter before transmitting it.
    typical_cause: A setpoint above the model rating, a dwell longer than 6.5535 s, a register outside 1..25, a list name longer than 10 characters.
    recoverable: false
    planner_action: Correct the test data. This error never reaches the instrument, so no state changed.
  - id: BK8500StateError
    meaning: The operation is illegal in the present driver state.
    typical_cause: Load Input On before Claim Remote Control, or a stability wait that timed out.
    recoverable: true
    planner_action: Insert the missing precondition keyword, or extend the timeout.
  - id: BK8500SafetyError
    meaning: A driver safety rule blocks the operation.
    typical_cause: Selecting the SHORT function through Set Load Function.
    recoverable: false
    planner_action: Do not work around this in generated tests. Escalate to a human who can authorise Set Load Function Unchecked.
  - id: BK8500ProtectionError
    meaning: The instrument reports an active protection flag.
    flags: [reverse_voltage, over_voltage, over_current, over_power, over_temperature]
    typical_cause: Reversed DUT leads, a source stiffer than expected, a CR setpoint too low, or blocked cooling.
    recoverable: false
    planner_action: Open the input immediately, stop the test, and report the flag names. Do not clear and continue automatically.
  - id: BK8500VerificationError
    meaning: A pass/fail oracle failed. Subclass of AssertionError, so Robot reports it as a test failure.
    typical_cause: The DUT is out of specification, or the tolerance is tighter than the instrument's accuracy allows.
    recoverable: false
    planner_action: Report as a test failure. Before tightening or loosening a tolerance, check it against the accuracy figures in resources.provided.

safety_rules:
  hard_rules:
    - id: SR-1
      rule: Never call Load Input On before Claim Remote Control.
      enforcement: Enforced in the driver; raises BK8500StateError without transmitting.
    - id: SR-2
      rule: Never leave a test with the input closed.
      enforcement: Test teardown must call Load Input Off or Reset Load To Safe State. Close Load Connection performs the safe-state sequence by default.
    - id: SR-3
      rule: Configure protection limits before the first Load Input On of a suite.
      enforcement: Convention plus the suite setup contract below. The driver cannot verify DUT wiring.
    - id: SR-4
      rule: Never select the SHORT function in a generated test.
      enforcement: Set Load Function raises BK8500SafetyError. Set Load Function Unchecked exists only for explicitly authorised, human-reviewed suites.
    - id: SR-5
      rule: Never exceed the model's rated voltage, current or power, and never exceed the DUT's rating even when the instrument would allow it.
      enforcement: The driver validates against the model table. The DUT rating is bench knowledge and must come from the RFDS-018 bench contract.
    - id: SR-6
      rule: Stop the test on any protection flag. Do not clear and retry automatically.
      enforcement: Load Should Report No Protection Faults raises BK8500ProtectionError.
    - id: SR-7
      rule: Do not disable the front panel LOCAL key in an unattended suite.
      enforcement: Convention. Set Local Key Enabled with enabled=False removes the operator's manual escape route.
  forbidden_sequences:
    - {sequence: [Set Load Function Unchecked SHORT, Load Input On], reason: Commands the model's full rated sink current into the DUT.}
    - {sequence: [Apply Constant Voltage below the source voltage, Load Input On], reason: In CV the load sinks whatever current is needed to pull the terminal down, so a stiff source runs straight into the current limit.}
    - {sequence: [Release Remote Control while the input is closed], reason: Leaves the load energised with no bus control; the operator inherits a live sink.}
    - {sequence: [Recall Load Settings, Load Input On], reason: A recall can raise a setpoint or lower a limit silently. Read both back first.}
  operator_actions_required:
    - Connect the DUT with the correct polarity before the suite runs. Reverse polarity is reported as a fault, not corrected.
    - Use a TTL-level adapter on the instrument's DB9. A direct connection to a standard RS-232 port can damage the instrument.
    - Confirm that the wiring and fixture are rated for the highest current the suite programs.
    - Confirm airflow around the instrument for sustained high-power tests.
  thermal_note: >
    All energy drawn from the DUT is dissipated inside the load. Sustained
    operation near the power rating raises the internal temperature and can
    trip over-temperature protection; derating and airflow are bench concerns
    that this driver cannot observe.

verification_objectives:
  - id: VO-IDENT
    objective: The instrument is reachable and identifies itself.
    procedure: [Open Load Connection, Get Load Product Information]
    oracle: "model is non-empty and firmware_version matches ^[0-9A-F]+\\.[0-9A-F]+$"
    risk: none
  - id: VO-PROT-RT
    objective: Protection limits can be written and read back.
    procedure: [Configure Load Protection, Get Load Protection Limits]
    oracle: "each returned value equals the written value within one instrument count (1 mV, 0.1 mA, 1 mW)"
    risk: none
  - id: VO-MODE-RT
    objective: Every regulation mode can be selected and observed.
    procedure: [Set Load Mode for each of CC CV CW CR, Load Mode Should Be]
    oracle: "the mode read back equals the mode written, for all four modes"
    risk: none
  - id: VO-SETPOINT-RT
    objective: Setpoints survive a write/read round trip at the instrument's resolution.
    procedure: [Set Load Setpoint, Get Load Setpoint]
    oracle: "abs(read - written) <= one instrument count for that quantity"
    risk: none
  - id: VO-INPUT-OFF
    objective: With the input open the load draws no current.
    procedure: [Load Input Off, Load Current Should Be Within]
    oracle: "measured current <= 5 mA"
    risk: none
  - id: VO-CC-REG
    objective: In CC the sink current tracks the setpoint.
    procedure: [Configure Load Protection, Apply Constant Current with enable_input, Wait Until Load Reading Is Stable, Load Current Should Be Within]
    oracle: "abs(measured - setpoint) <= 0.2 % of reading + 0.15 % of full scale, widened by the source's own regulation"
    risk: high
    teardown_required: true
  - id: VO-CR-REG
    objective: In CR the current follows Ohm's law at the measured terminal voltage.
    procedure: [Apply Constant Resistance with enable_input, Wait Until Load Reading Is Stable, Measure Load Input, Load Current Should Be Within]
    oracle: "abs(measured_current - measured_voltage / resistance) <= 1 % of reading + 0.3 % of full scale"
    risk: high
    teardown_required: true
  - id: VO-POWER-CONSISTENCY
    objective: Reported power agrees with the product of reported voltage and current.
    procedure: [Sink a steady load, Measure Load Input]
    oracle: "abs(power_w - voltage_v * current_a) <= 2 % of the product, floor 50 mW"
    risk: medium
  - id: VO-TRAN-RT
    objective: Transient parameters survive a round trip, including the 0.1 ms dwell quantisation.
    procedure: [Configure Load Transient, Get Load Transient]
    oracle: "levels equal within one count and dwell times equal within 0.1 ms"
    risk: none
  - id: VO-LIST-RT
    objective: A programmed list reads back step by step.
    procedure: [Configure Load List, Get Load List Step Count, Get Load List Step]
    oracle: "step count equals the number of programmed steps and each step's level and dwell match within one count"
    risk: none
  - id: VO-TRIG
    objective: The software trigger is accepted only when the trigger source is BUS.
    procedure: [Set Load Trigger Source IMMEDIATE, Trigger Load, Set Load Trigger Source BUS, Trigger Load]
    oracle: "the first Trigger Load raises BK8500CommandError with status 0xB0 and the second succeeds"
    risk: low
  - id: VO-GUARD
    objective: The driver refuses a setpoint above the model rating without transmitting it.
    procedure: [Get Load Rated Limits, Set Load Setpoint above the rating]
    oracle: "BK8500ValidationError is raised and the instrument setpoint is unchanged"
    risk: none
  - id: VO-SHORT-GUARD
    objective: The SHORT function is not reachable through the ordinary keyword.
    procedure: [Set Load Function SHORT]
    oracle: "BK8500SafetyError is raised"
    risk: none
  - id: VO-TEARDOWN
    objective: The safe-state sequence always de-energises the load.
    procedure: [Sink a load, Reset Load To Safe State, Load Input State Should Be OFF, Get Load Function]
    oracle: "input state is OFF and function is FIXED"
    risk: medium
  - id: VO-PROTECTION-TRIP
    objective: An over-current condition is reported through the demand-state register.
    procedure: [Configure Load Protection with a max current below the intended sink, Apply Constant Current above it, Load Should Report No Protection Faults]
    oracle: "BK8500ProtectionError is raised listing over_current"
    risk: high
    note: Run this only on a bench and DUT explicitly authorised for a deliberate protection trip.

setup_teardown_contract:
  suite_setup:
    ordered_steps:
      - Open Load Connection with the bench's port, baud rate, address and model.
      - Get Load Product Information and record model, serial number and firmware in the test log.
      - Claim Remote Control.
      - Configure Load Protection with limits derived from the DUT rating, not the instrument rating.
      - Load Input Off, to start from a known de-energised state.
    rationale: Nothing may sink current before the protection limits are in place.
  test_setup:
    ordered_steps: [Set Load Function FIXED, Set the mode and setpoint required by the test]
  test_teardown:
    ordered_steps: [Load Input Off, Set Load Function FIXED]
    must_run_on_failure: true
    rationale: A failing test must never hand a closed input to the next test.
  suite_teardown:
    ordered_steps: [Reset Load To Safe State, Close All Load Connections]
    must_run_on_failure: true
  robot_snippet: |
    *** Settings ***
    Library           BK8500Library    auto_connect=${FALSE}
    Suite Setup       Connect To DC Load
    Suite Teardown    Disconnect From DC Load
    Test Teardown     Return Load To Idle

limitations:
  - id: LIM-1
    limitation: Single-shot measurement only. There is no buffered acquisition, no hardware timestamping and no streaming.
    consequence: Sample rate is bounded by the serial round trip, roughly 10 to 30 readings per second at 9600 baud. Anything faster needs a scope or a DAQ.
  - id: LIM-2
    limitation: Transient and list dwell fields are 2 bytes of 0.1 ms, so 6.5535 s is the maximum dwell.
    consequence: Longer profiles must be built from several steps, or driven from the test rather than the instrument.
  - id: LIM-3
    limitation: Trigger latency over the serial link is tens of milliseconds and jitters.
    consequence: Do not use Trigger Load as a timing reference for a measurement that needs better than about 50 ms alignment. Use the EXTERNAL trigger input for that.
  - id: LIM-4
    limitation: The driver cannot detect DUT wiring, fixture rating or airflow.
    consequence: Safety rules SR-3, SR-5 and the operator actions depend on bench-level information from an RFDS-018 contract.
  - id: LIM-5
    limitation: The instrument has no query for the input relay state other than the operation-state register inside a 0x5F reading.
    consequence: Input state is only observable together with a measurement; there is no zero-cost state poll.
  - id: LIM-6
    limitation: Calibration commands (0x60..0x69) and the bar code command (0x6B) are not exposed.
    consequence: Calibration must be performed with the vendor's tools. This is deliberate; a mis-issued calibration command corrupts the instrument's EEPROM.
  - id: LIM-7
    limitation: Multi-drop addressing is defined by the protocol but is not validated by this driver beyond passing the address through.
    consequence: Treat one port as one instrument until a bench proves otherwise.
  - id: LIM-8
    limitation: The BATTERY function is programmable (cut-off voltage, function selection) but the driver does not implement amp-hour readout.
    consequence: Capacity must be integrated by the test from periodic readings, or read from the front panel.
  - id: LIM-11
    limitation: The manual does not state the command byte of a reply to a read command, and the vendor's own examples never check it.
    consequence: The driver accepts both framings and records which one the instrument used in response_style. A reply of 0x12 with status 0x80 and an otherwise empty payload is genuinely ambiguous between "success, no data" and "data beginning with 0x80"; the driver refuses to guess and raises BK8500ProtocolError. Confirm response_style on the first hardware run.
  - id: LIM-12
    limitation: Firmware version decoding assumes hexadecimal, not BCD.
    consequence: The decoded string may be wrong for some firmware. The undecoded bytes are returned as firmware_raw so the value can be checked against the front panel.
  - id: LIM-10
    limitation: The link depends on DTR and RTS being asserted, and neither line is available as flow control.
    consequence: Any adapter or virtual COM driver that drops these lines makes the instrument appear dead. The driver asserts and verifies them on open, but cannot re-verify them mid-session; a mid-run drop surfaces as BK8500TimeoutError.
  - id: LIM-9
    limitation: The simulated transport models the register set and a Thevenin source, not the analogue behaviour of the instrument.
    consequence: A suite that passes in simulation proves keyword and sequencing correctness, not measurement correctness. Simulation never substitutes for a hardware run in a release gate.

planning_hints:
  sequencing:
    - Always order operations as: connect, identify, claim remote, set protection, set mode, set setpoint, close input, settle, measure, open input.
    - Set the setpoint before closing the input. A mode's setpoint register keeps its previous value, so closing the input first can apply a stale load.
    - Insert Wait Until Load Reading Is Stable between closing the input and the first oracle when the source has a slow control loop.
  choosing_a_mode:
    - CC for supply regulation, efficiency and thermal soak tests.
    - CV for testing a source's current limit and for characterising a battery charger.
    - CW for battery run-time and constant-power discharge profiles.
    - CR for emulating a resistive load and for soft start-up, since the current rises with the source voltage.
  choosing_tolerances:
    - Derive tolerances from resources.provided accuracy figures plus the DUT's own specification. A tolerance tighter than the instrument's accuracy will fail intermittently for no useful reason.
    - Current accuracy is the binding term in most CC tests; voltage accuracy is usually far better than the DUT.
  budgeting_time:
    - Estimate roughly 60 ms per transaction at 9600 baud. A 1000 step list is about one minute of programming alone.
    - Prefer one Measure Load Input over three separate Get Load Voltage / Current / Power calls; it is one transaction instead of three and the values are consistent with each other.
  parallelism:
    - One driver instance per serial port, and no concurrent keyword calls against one instance. The protocol has no framing recovery.
    - Several loads on separate ports may be used from one suite through connection aliases.
  bench_integration:
    - This driver is a sink. A complete test usually pairs it with a source (PSU) driver and often a DMM for an independent voltage reference.
    - When a bench contract lists a DMM as the preferred voltage source for a measurement, use the DMM for the oracle and this driver's reading only as a sanity check.
  developing_without_hardware:
    - Use simulated=${TRUE} to develop and lint a suite. Keyword names, argument handling, sequencing and teardown are all exercised.
    - The package test tests/test_all_keyword_execution.py invokes every public keyword against the simulator.
    - Do not report a simulated run as evidence of a passed verification objective that involves real measurement.
  complete_driver_verification:
    - Run hardware_tests/01_all_library_keywords.robot for one independently reported result per public keyword.
    - Keep ALLOW_INPUT_ON false unless the source, wiring, polarity and current limit have been verified.
    - Keep ALLOW_PERSISTENT_WRITES false unless overwriting the selected settings register and list slot is acceptable.

unknown_handling:
  principle: >
    When the driver cannot determine something, it says so rather than
    guessing. A planner must treat UNKNOWN as a reason to ask or to stop, not
    as permission to proceed.
  cases:
    - situation: The instrument model is not in the driver's model table.
      behaviour: Validation falls back to the UNKNOWN envelope (60 V, 15 A, 300 W), the smallest rating in the series, so no request can exceed the real instrument.
      planner_action: Supply the correct model in Open Load Connection, or restrict the test to the conservative envelope.
    - situation: The declared model and the instrument's reported model disagree.
      behaviour: The driver logs a warning and uses the instrument's reported model.
      planner_action: Treat this as a bench configuration defect and report it.
    - situation: The DUT's rating is not known to the driver.
      behaviour: The driver validates only against the instrument rating.
      planner_action: Obtain the DUT rating from the bench contract. Never let the instrument rating stand in for it.
    - situation: A reading is requested while the input is open.
      behaviour: The instrument returns the terminal voltage with the current near zero. This is valid data, not an error.
      planner_action: Check input_on in the reading before interpreting a zero current as a DUT failure.
    - situation: The instrument answers a read with a status frame carrying no data.
      behaviour: BK8500ProtocolError, naming the ambiguity, rather than returning 0x80 counts as if it were a measurement.
      planner_action: Treat the read command as unsupported by that firmware and route the objective elsewhere.
    - situation: The firmware version string looks implausible (for example 1.0A).
      behaviour: The driver reports its best-effort decode and the raw bytes.
      planner_action: Compare firmware_raw with the front panel before relying on the string in a report.
    - situation: A quantity this driver does not measure is requested (temperature, ripple, AC content).
      behaviour: Not offered. There is no keyword for it.
      planner_action: Route the objective to another instrument in the bench contract.
  never_do:
    - Never infer a value the instrument did not return.
    - Never widen a tolerance to make a test pass.
    - Never substitute a simulated run for a hardware verification objective.

conformance:
  rules:
    - id: CR-1
      rule: Every keyword listed in capabilities exists in BK8500Library with the documented name and argument names.
      verified_by: tests/test_contract_conformance.py::test_every_contract_capability_exists
    - id: CR-2
      rule: Every keyword in the library appears in capabilities.
      verified_by: tests/test_contract_conformance.py::test_no_undocumented_keywords
    - id: CR-3
      rule: Every error id in error_catalogue is an exception class exported by the package.
      verified_by: tests/test_contract_conformance.py::test_error_catalogue_matches_exceptions
    - id: CR-4
      rule: Every error referenced by a capability appears in error_catalogue.
      verified_by: tests/test_contract_conformance.py::test_capability_errors_are_catalogued
    - id: CR-5
      rule: The contract version equals the package version.
      verified_by: tests/test_contract_conformance.py::test_version_matches_package
    - id: CR-6
      rule: bk8500_load_ai_contract.lock holds the SHA-256 of bk8500_load_ai_contract.yaml, so a silent edit is detectable.
      verified_by: tests/test_contract_conformance.py::test_lock_file_matches_contract
    - id: CR-7
      rule: Every verification objective id appears as a documented test in atest/.
      verified_by: tests/test_contract_conformance.py::test_verification_objectives_have_tests
    - id: CR-8
      rule: Every public keyword executes against the simulator in one complete API regression.
      verified_by: tests/test_all_keyword_execution.py::test_every_public_keyword_executes_against_simulated_device
    - id: CR-9
      rule: The physical-device conformance suite references every public keyword and gates hazardous actions.
      verified_by: tests/test_hardware_conformance_suite.py
  regeneration: python3 tools/generate_lock.py
  contract_is_authoritative: >
    Where this contract and the source disagree, the conformance tests fail and
    the disagreement is a defect. Neither is silently preferred.
