  - keyword: Apply Constant Current
    signature: "Apply Constant Current    current    enable_input=False"
    purpose: Select CC mode, write the current setpoint, force FIXED function and optionally close the input.
    inputs:
      current: {type: float, unit: A, range: [0, model rated current]}
      enable_input: {type: boolean, default: false, note: When true this keyword starts current flow and inherits the risk of Load Input On.}
    outputs: {type: none}
    preconditions: [State is REMOTE_IDLE or REMOTE_ACTIVE., Protection limits configured.]
    postconditions: [Mode is CC., Function is FIXED., Input is closed when enable_input is true.]
    side_effects: [Ordering is fixed: mode, then setpoint, then function, then input, so the DUT never sees a stale level.]
    risk_level: high
    timing: {typical_ms: 200, worst_case_ms: 3000}
    stabilization_delay_s: 0.1
    retry_policy: *retry_transport
    errors: [BK8500ValidationError, BK8500StateError, BK8500CommandError]
    exclusive_resources: [instrument, dut_electrical_node]

  - keyword: Apply Constant Voltage
    signature: "Apply Constant Voltage    voltage    enable_input=False"
    purpose: Select CV mode, write the voltage setpoint, force FIXED function and optionally close the input.
    inputs: {voltage: {type: float, unit: V, range: [0, model rated voltage]}, enable_input: {type: boolean, default: false}}
    outputs: {type: none}
    preconditions: [State is REMOTE_IDLE or REMOTE_ACTIVE., Protection limits configured.]
    postconditions: [Mode is CV., Function is FIXED.]
    side_effects: [In CV the load draws whatever current is needed to hold the terminal voltage; a stiff source can drive the current straight to the protection limit.]
    risk_level: high
    timing: {typical_ms: 200, worst_case_ms: 3000}
    stabilization_delay_s: 0.1
    retry_policy: *retry_transport
    errors: [BK8500ValidationError, BK8500StateError, BK8500CommandError]
    exclusive_resources: [instrument, dut_electrical_node]

  - keyword: Apply Constant Power
    signature: "Apply Constant Power    power    enable_input=False"
    purpose: Select CW mode, write the power setpoint, force FIXED function and optionally close the input.
    inputs: {power: {type: float, unit: W, range: [0, model rated power]}, enable_input: {type: boolean, default: false}}
    outputs: {type: none}
    preconditions: [State is REMOTE_IDLE or REMOTE_ACTIVE., Protection limits configured.]
    postconditions: [Mode is CW., Function is FIXED.]
    side_effects: [Constant power means current rises as the source voltage falls; on a discharging battery this accelerates towards the current limit.]
    risk_level: high
    timing: {typical_ms: 200, worst_case_ms: 3000}
    stabilization_delay_s: 0.1
    retry_policy: *retry_transport
    errors: [BK8500ValidationError, BK8500StateError, BK8500CommandError]
    exclusive_resources: [instrument, dut_electrical_node]

  - keyword: Apply Constant Resistance
    signature: "Apply Constant Resistance    resistance    enable_input=False"
    purpose: Select CR mode, write the resistance setpoint, force FIXED function and optionally close the input.
    inputs: {resistance: {type: float, unit: ohm, range: [0.1, 4000]}, enable_input: {type: boolean, default: false}}
    outputs: {type: none}
    preconditions: [State is REMOTE_IDLE or REMOTE_ACTIVE., Protection limits configured.]
    postconditions: [Mode is CR., Function is FIXED.]
    side_effects: [Small resistances at high source voltage produce large currents; check V/R against the model rating before closing the input.]
    risk_level: high
    timing: {typical_ms: 200, worst_case_ms: 3000}
    stabilization_delay_s: 0.1
    retry_policy: *retry_transport
    errors: [BK8500ValidationError, BK8500StateError, BK8500CommandError]
    exclusive_resources: [instrument, dut_electrical_node]

  - keyword: Set Load Function
    signature: "Set Load Function    function"
    purpose: Select FIXED, TRANSIENT, LIST or BATTERY operation (command 0x5D).
    inputs: {function: {type: string, allowed: [FIXED, TRANSIENT, LIST, BATTERY], rejected: [SHORT]}}
    outputs: {type: string, description: the function that was applied}
    preconditions: [State is REMOTE_IDLE or REMOTE_ACTIVE., For TRANSIENT the transient parameters are already programmed., For LIST the list is already programmed., For BATTERY the cut-off voltage is already set.]
    postconditions: [The selected function governs the load's behaviour when the input closes.]
    side_effects: [SHORT is refused by the driver because it commands the model's maximum sink current; use Set Load Function Unchecked when the bench contract permits it.]
    risk_level: medium
    timing: {typical_ms: 60, worst_case_ms: 1000}
    stabilization_delay_s: 0.05
    retry_policy: *retry_transport
    errors: [BK8500SafetyError, BK8500ValidationError, BK8500CommandError]
    exclusive_resources: [instrument]

  - keyword: Set Load Function Unchecked
    signature: "Set Load Function Unchecked    function"
    purpose: Select any function including SHORT, bypassing the driver's SHORT guard.
    inputs: {function: {type: string, allowed: [FIXED, SHORT, TRANSIENT, LIST, BATTERY]}}
    outputs: {type: string}
    preconditions: [State is REMOTE_IDLE., The bench contract explicitly authorises a short-circuit test on this DUT., The DUT and wiring survive the model's full rated sink current.]
    postconditions: [The selected function is active.]
    side_effects: [With SHORT and the input closed the load draws its maximum rated current. This can destroy the DUT, the wiring or the fixture.]
    risk_level: critical
    timing: {typical_ms: 60, worst_case_ms: 1000}
    stabilization_delay_s: 0.05
    retry_policy: *retry_none
    errors: [BK8500ValidationError, BK8500CommandError]
    exclusive_resources: [instrument, dut_electrical_node]

