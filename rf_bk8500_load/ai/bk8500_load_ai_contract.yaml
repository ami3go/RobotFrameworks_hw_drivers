  - keyword: Configure Load Protection
    signature: "Configure Load Protection    max_voltage=None    max_current=None    max_power=None"
    purpose: Write the instrument's own protection limits (commands 0x22, 0x24, 0x26).
    inputs:
      max_voltage: {type: float, unit: V, range: [0, model rated voltage], optional: true}
      max_current: {type: float, unit: A, range: [0, model rated current], optional: true}
      max_power: {type: float, unit: W, range: [0, model rated power], optional: true}
    outputs: {type: none}
    preconditions: [State is REMOTE_IDLE. Setting limits below the present operating point while the input is closed will trip protection.]
    postconditions: [The instrument enforces the limits independently of the setpoint.]
    side_effects: [Values are retained by the instrument across mode changes and, on some firmware, across power cycles.]
    risk_level: low
    timing: {typical_ms: 180, worst_case_ms: 3000}
    stabilization_delay_s: 0
    retry_policy: *retry_transport
    errors: [BK8500ValidationError, BK8500CommandError, BK8500ConnectionError]
    exclusive_resources: [instrument]

