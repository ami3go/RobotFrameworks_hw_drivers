    inputs: {}
    outputs: {type: none}
    preconditions: [A connection is open.]
    postconditions: [State is REMOTE_IDLE., Sink current falls to zero.]
    side_effects: [The DUT sees an abrupt unload; a source with a slow control loop may overshoot.]
    risk_level: low
    timing: {typical_ms: 60, worst_case_ms: 1000}
    stabilization_delay_s: 0.2
    retry_policy: *retry_transport
    errors: [BK8500ConnectionError, BK8500CommandError]
