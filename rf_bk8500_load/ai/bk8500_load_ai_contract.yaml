    outputs: {type: string, allowed: [FIXED, SHORT, TRANSIENT, LIST, BATTERY]}
    preconditions: [A connection is open.]
    postconditions: [No state change.]
    side_effects: [One 0x5E transaction.]
    risk_level: none
    timing: {typical_ms: 60, worst_case_ms: 1000}
    stabilization_delay_s: 0
    retry_policy: *retry_transport
    errors: [BK8500ConnectionError, BK8500ProtocolError]
    exclusive_resources: [serial_port]

  - keyword: Configure Load Transient
    signature: "Configure Load Transient    mode    level_a    dwell_a    level_b    dwell_b    operation=CONTINUOUS"
    purpose: Program A/B transient toggling for one mode (commands 0x32, 0x34, 0x36, 0x38).
    inputs:
      mode: {type: string, allowed: [CC, CV, CW, CR]}
      level_a: {type: float, unit: mode dependent, range: same as the mode setpoint}
      dwell_a: {type: float, unit: s, range: [0, 6.5535], note: The wire field is 2 bytes of 0.1 ms, so 6.5535 s is the hard ceiling.}
      level_b: {type: float, unit: mode dependent}
      dwell_b: {type: float, unit: s, range: [0, 6.5535]}
      operation: {type: string, allowed: [CONTINUOUS, PULSE, TOGGLED], default: CONTINUOUS}
    outputs: {type: none}
    preconditions: [State is REMOTE_IDLE.]
    postconditions: [The transient registers hold the programmed pair. The function must still be set to TRANSIENT for them to take effect.]
    side_effects: [None until the function is TRANSIENT and the input is closed.]
    risk_level: low
    timing: {typical_ms: 60, worst_case_ms: 1000}
    stabilization_delay_s: 0
    retry_policy: *retry_transport
    errors: [BK8500ValidationError, BK8500CommandError]
    exclusive_resources: [instrument]

