    risk_level: none
    timing: {typical_ms: 180, worst_case_ms: 3000}
    stabilization_delay_s: 0
    retry_policy: *retry_transport
    errors: [BK8500ConnectionError, BK8500ProtocolError]
    exclusive_resources: [serial_port]

  - keyword: Set Load Mode
    signature: "Set Load Mode    mode"
    purpose: Select the regulation law (command 0x28).
    inputs: {mode: {type: string, allowed: [CC, CV, CW, CR], case_insensitive: true}}
    outputs: {type: string, description: the mode that was applied}
    preconditions: [State is REMOTE_IDLE or REMOTE_ACTIVE.]
    postconditions: [The instrument regulates according to the selected mode's own setpoint register.]
    side_effects: [Changing mode while the input is closed changes the load on the DUT immediately, using whatever value that mode's setpoint register already holds.]
    risk_level: medium
    timing: {typical_ms: 60, worst_case_ms: 1000}
    stabilization_delay_s: 0.05
    retry_policy: *retry_transport
    errors: [BK8500ValidationError, BK8500CommandError, BK8500ConnectionError]
    exclusive_resources: [instrument]

  - keyword: Get Load Mode
    signature: "Get Load Mode"
