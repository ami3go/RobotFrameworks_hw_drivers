    inputs: {enabled: {type: boolean, required: true}}
    outputs: {type: none}
    preconditions: [State is REMOTE_IDLE or REMOTE_ACTIVE., The sense leads are physically connected before enabling.]
    postconditions: [Voltage regulation and measurement reference the sense terminals.]
    side_effects: [Enabling remote sense without wired sense leads makes the instrument regulate on an undefined voltage; the demand-state bit "remote_sense_terminal_not_connected" reports this.]
    risk_level: medium
    timing: {typical_ms: 60, worst_case_ms: 1000}
    stabilization_delay_s: 0.2
    retry_policy: *retry_transport
