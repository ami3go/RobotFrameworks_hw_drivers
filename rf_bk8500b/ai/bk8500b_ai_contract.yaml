rfds017_version: '3.0'
identity:
  driver_name: BK8500BLibrary
  driver_version: 26.4.0
  contract_version: 1.0.0
  supported_models:
  - 8500B
  - 8502B
  - 8510B
  - 8514B
  - 8542B
  instrument_class: LOAD
  primary_role: Controls a programmable DC electronic load that sinks voltage-dependent current or power from a DUT or source.
mental_model:
  physical_object: One or more B&K Precision 8500B-series DC electronic loads connected through exclusive serial or VISA-compatible
    sessions and selected by Robot Framework alias.
  configuration_persistence: PERSISTS_UNTIL_RESET
  concurrency:
    max_parallel_sessions: 1
    thread_safe: false
  ownership: Each alias owns one exclusive instrument transport; the SUITE-scoped library owns all aliases until explicit
    disconnect or suite teardown.
  blocking_behavior: All public keywords are synchronous. Polling and CSV logging have finite iteration or timeout limits.
  configuration_scope: Configuration is per physical instrument. Selecting another alias does not copy state.
state_machine:
  states:
  - DISCONNECTED
  - CONNECTING
  - CONNECTED_UNSYNCHRONIZED
  - CONNECTED_READY_INPUT_OFF
  - CONNECTED_READY_INPUT_ON
  - DEGRADED
  - RECONNECTING
  - CLOSING
  - FAILED
  initial_state: DISCONNECTED
  transitions:
  - from: DISCONNECTED
    to: CONNECTING
    via_capability: Connect To Electronic Load
  - from: CONNECTING
    to: CONNECTED_UNSYNCHRONIZED
    via_capability: Connect To Electronic Load
  - from: CONNECTED_UNSYNCHRONIZED
    to: CONNECTED_READY_INPUT_OFF
    via_capability: Synchronize Electronic Load State
  - from: CONNECTED_READY_INPUT_OFF
    to: CONNECTED_READY_INPUT_ON
    via_capability: Enable Electronic Load Input
  - from: CONNECTED_READY_INPUT_OFF
    to: CONNECTED_READY_INPUT_ON
    via_capability: Configure And Enable Load
  - from: CONNECTED_READY_INPUT_ON
    to: CONNECTED_READY_INPUT_OFF
    via_capability: Disable Electronic Load Input
  - from: CONNECTED_READY_INPUT_OFF
    to: DEGRADED
    via_capability: Write Raw SCPI
  - from: CONNECTED_READY_INPUT_ON
    to: DEGRADED
    via_capability: Write Raw SCPI
  - from: DEGRADED
    to: CONNECTED_READY_INPUT_OFF
    via_capability: Synchronize Electronic Load State
  - from: DEGRADED
    to: RECONNECTING
    via_capability: Reconnect Electronic Load
  - from: RECONNECTING
    to: CONNECTED_READY_INPUT_OFF
    via_capability: Reconnect Electronic Load
  - from: CONNECTED_READY_INPUT_OFF
    to: CLOSING
    via_capability: Disconnect Electronic Load
  - from: CONNECTED_READY_INPUT_ON
    to: CLOSING
    via_capability: Disconnect Electronic Load
  - from: FAILED
    to: CLOSING
    via_capability: Disconnect Electronic Load
  - from: CLOSING
    to: DISCONNECTED
    via_capability: Disconnect Electronic Load
resources:
  consumes:
  - name: SERIAL_OR_VISA_SESSION
    access: EXCLUSIVE
    description: Exclusive serial/USB-serial or VISA-compatible session to one electronic load per alias.
  - name: HOST_FILESYSTEM_PATH
    access: SHARED_WRITE
    description: Host path used for CSV and JSON evidence output.
  - name: DUT_OR_SOURCE_OUTPUT
    access: EXCLUSIVE
    description: Electrical source connected to the load input terminals during active-load operations.
  provides:
  - name: PROGRAMMABLE_DC_LOAD
    description: Programmable CC, CV, CP/CW, CR, dynamic, LED, and impedance loading.
  - name: LOAD_TELEMETRY
    description: Voltage, current, power, resistance, status, protection, peak, and diagnostic measurements.
  - name: ROBOT_EVIDENCE_FILES
    description: Optional CSV measurement logs and JSON diagnostic snapshots.
  physical_signals:
    inputs:
    - name: LOAD_INPUT_VOLTAGE
      unit: V
      range:
      - 0
      - 500
    - name: LOAD_INPUT_CURRENT
      unit: A
      range:
      - 0
      - 240
    - name: LOAD_INPUT_POWER
      unit: W
      range:
      - 0
      - 1500
    outputs: []
dependencies:
  requires_before:
  - ProgrammablePowerSupplyLibrary
  enables_after:
  - DmmLibrary
  - OscilloscopeLibrary
  - DutControlLibrary
  conflicts_with:
  - Any driver or process owning the same serial/VISA resource or directly controlling the same load input.
connection_points:
  inputs:
  - name: LOAD_POSITIVE
    signal: DC_POWER
    connector: BINDING_POST_OR_MODEL_SPECIFIC_TERMINAL
  - name: LOAD_NEGATIVE
    signal: DC_RETURN
    connector: BINDING_POST_OR_MODEL_SPECIFIC_TERMINAL
  - name: REMOTE_SENSE_POSITIVE
    signal: DC_SENSE
    connector: MODEL_SPECIFIC_TERMINAL
  - name: REMOTE_SENSE_NEGATIVE
    signal: DC_SENSE_RETURN
    connector: MODEL_SPECIFIC_TERMINAL
  outputs: []
measurement_quality:
  voltage:
    preferred_for:
    - MONITORING
    - PROTECTION_DIAGNOSTICS
    confidence: MEDIUM
    accuracy_source: MANUFACTURER_SPEC_REQUIRED_FOR_EXACT_MODEL
  current:
    preferred_for:
    - MONITORING
    - LOAD_REGULATION_CHECK
    confidence: MEDIUM
    accuracy_source: MANUFACTURER_SPEC_REQUIRED_FOR_EXACT_MODEL
  power:
    preferred_for:
    - MONITORING
    confidence: MEDIUM
    accuracy_source: DERIVED_OR_INSTRUMENT_SPEC
  resistance:
    preferred_for:
    - DEBUG
    confidence: LOW
    accuracy_source: MODE_AND_MODEL_DEPENDENT
implementation_status:
  maturity: RELEASE_CANDIDATE
  validation:
  - UNIT_TESTED
  - FAKE_TRANSPORT_VALIDATED
  - ROBOT_ACCEPTANCE_VALIDATED
  - PACKAGE_VALIDATED
  not_validated:
  - HIL_VALIDATED
  - LONG_DURATION_TESTED
  - MULTI_PROCESS_VALIDATED
capabilities:
- keyword: Connect To Electronic Load
  signature: Connect To Electronic Load(port=None, alias='default', protocol='scpi', baud_rate=9600, address=0, read_timeout=2.0,
    write_timeout=2.0, query_timeout=2.0, verify_writes=True, turn_input_off_on_close=True, require_enable_token=False, allow_short=False,
    reconnect=False)
  purpose: Connect to an electronic load and select it as the active session.
  risk_level: LOW
  blocking: BLOCKING
  idempotency: NON_IDEMPOTENT
  retry: RETRY_AFTER_RESET
  typical_execution_time_s: 3.0
  stabilization_time_s: 0.0
  valid_in_states:
  - DISCONNECTED
  resulting_state: CONNECTED_READY_INPUT_OFF
  arguments:
  - name: port
    kind: STRING
    required: false
    default: null
  - name: alias
    kind: STRING
    required: false
    default: default
  - name: protocol
    kind: ENUM
    required: false
    default: scpi
    values:
    - scpi
    - legacy
    - auto
  - name: baud_rate
    kind: NUMERIC
    required: false
    default: 9600
    unit: '1'
    range:
    - 1
    - 10000000
  - name: address
    kind: NUMERIC
    required: false
    default: 0
    unit: '1'
    range:
    - 0
    - 31
  - name: read_timeout
    kind: DURATION
    required: false
    default: 2.0
    unit: S
    range:
    - 0.001
    - 3600
  - name: write_timeout
    kind: DURATION
    required: false
    default: 2.0
    unit: S
    range:
    - 0.001
    - 3600
  - name: query_timeout
    kind: DURATION
    required: false
    default: 2.0
    unit: S
    range:
    - 0.001
    - 3600
  - name: verify_writes
    kind: BOOLEAN
    required: false
    default: true
  - name: turn_input_off_on_close
    kind: BOOLEAN
    required: false
    default: true
  - name: require_enable_token
    kind: BOOLEAN
    required: false
    default: false
  - name: allow_short
    kind: BOOLEAN
    required: false
    default: false
  - name: reconnect
    kind: BOOLEAN
    required: false
    default: false
  returns:
  - name: result
    kind: STRING
    format: ROBOT_DICTIONARY
  preconditions:
  - The serial or VISA-compatible port exists and is not owned by another process.
  - The alias is not already registered.
  postconditions:
  - A synchronized session is registered under the requested alias.
  - The selected alias becomes active.
  coupling:
  - 'MUTEX: Only one process may own the physical serial port at a time.'
  side_effects:
  - Opens an exclusive transport session.
  - Queries instrument identity and capabilities.
  exclusive_resources:
  - SERIAL_OR_VISA_SESSION
  raises:
  - COMM_TIMEOUT
  - CONNECTION_LOST
  - DUPLICATE_ALIAS
  - INVALID_ARGUMENT
  - PROTOCOL_ERROR
  - UNSUPPORTED_MODEL
  planning_priority: PRIMARY
- keyword: Disconnect Electronic Load
  signature: Disconnect Electronic Load(alias=None)
  purpose: Disconnect one load. The input is turned off first by default.
  risk_level: MEDIUM
  blocking: BLOCKING
  idempotency: CONDITIONALLY_IDEMPOTENT
  retry: NEVER_RETRY
  typical_execution_time_s: 1.0
  stabilization_time_s: 0.0
  valid_in_states:
  - CONNECTING
  - CONNECTED_UNSYNCHRONIZED
  - CONNECTED_READY_INPUT_OFF
  - CONNECTED_READY_INPUT_ON
  - DEGRADED
  - RECONNECTING
  - CLOSING
  - FAILED
  resulting_state: DISCONNECTED
  arguments:
  - name: alias
    kind: STRING
    required: false
    default: null
  returns: []
  preconditions:
  - The target alias exists.
  postconditions:
  - The transport is closed and the session registry no longer contains the disconnected alias.
  coupling: []
  side_effects:
  - Attempts to disable load input before closing when turn_input_off_on_close is enabled.
  - Releases the exclusive transport resource.
  exclusive_resources:
  - SERIAL_OR_VISA_SESSION
  raises:
  - COMM_TIMEOUT
  - CONNECTION_LOST
  - INDETERMINATE_OUTCOME
  - INSTRUMENT_REJECTED
  - NO_ACTIVE_SESSION
  planning_priority: PRIMARY
