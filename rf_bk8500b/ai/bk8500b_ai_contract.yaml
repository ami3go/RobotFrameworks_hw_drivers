errors:
- name: NO_ACTIVE_SESSION
  class: STATE_VIOLATION
  meaning: No selected alias exists or the requested alias is unknown.
  detection: BK8500BRobotError states that no active electronic load exists or lists known aliases.
  post_error_state: STATE_UNCHANGED
  retry: NEVER_RETRY
  recovery: Connect a load or select an alias returned by `List Electronic Load Sessions`.
- name: DUPLICATE_ALIAS
  class: CONFIGURATION
  meaning: A new connection attempted to reuse an existing alias.
  detection: BK8500BRobotError reports that the alias already exists.
  post_error_state: STATE_UNCHANGED
  retry: NEVER_RETRY
  recovery: Use a unique alias or call `Disconnect Electronic Load` before reconnecting.
- name: INVALID_ARGUMENT
  class: CONFIGURATION
  meaning: A keyword argument cannot be converted or violates a local constraint.
  detection: ValueError or BK8500BRobotError identifies the invalid argument.
  post_error_state: STATE_UNCHANGED
  retry: NEVER_RETRY
  recovery: Correct the argument using the capability signature and ranges, then call the keyword again.
- name: RANGE_REJECTED
  class: CONFIGURATION
  meaning: A numeric value exceeds the connected model rating or a command-specific range.
  detection: InstrumentRangeError is translated to BK8500BRobotError with requested value context.
  post_error_state: STATE_UNCHANGED
  retry: NEVER_RETRY
  recovery: Read `Get Electronic Load Capabilities`, select an in-range value, and repeat configuration while input is OFF.
- name: COMM_TIMEOUT
  class: COMMUNICATION
  meaning: The instrument did not complete a read or write before the configured timeout.
  detection: ReadTimeoutError, WriteTimeoutError, or LockTimeoutError is translated to BK8500BRobotError.
  post_error_state: STATE_UNDEFINED
  retry: RETRY_AFTER_RESET
  recovery: Call `Synchronize Electronic Load State`; if it fails, call `Reconnect Electronic Load`, then verify input state
    before continuing.
- name: CONNECTION_LOST
  class: COMMUNICATION
  meaning: The serial or VISA-compatible transport was lost.
  detection: ConnectionLostError or TransportError is translated to BK8500BRobotError.
  post_error_state: STATE_UNDEFINED
  retry: RETRY_AFTER_RESET
  recovery: Make the source safe independently, reconnect, identify the instrument, synchronize state, and verify input OFF.
- name: PROTOCOL_ERROR
  class: COMMUNICATION
  meaning: The response is malformed, oversized, out of frame, or fails checksum validation.
  detection: SCPIProtocolError, LegacyProtocolError, MalformedResponseError, ChecksumError, or FrameSyncError is translated
    to BK8500BRobotError.
  post_error_state: STATE_UNDEFINED
  retry: RETRY_AFTER_RESET
  recovery: Stop dependent actions, synchronize state, and reconnect if synchronization fails.
- name: UNSUPPORTED_MODEL
  class: CONFIGURATION
  meaning: The identified instrument model or requested feature is unsupported.
  detection: UnsupportedModelError or UnsupportedFeatureError is translated to BK8500BRobotError.
  post_error_state: STATE_UNCHANGED
  retry: NEVER_RETRY
  recovery: Use a supported 8500B-series model/feature or update the driver after hardware qualification.
- name: INSTRUMENT_REJECTED
  class: HARDWARE_FAULT
  meaning: The instrument rejected a syntactically valid command or reported a SCPI error.
  detection: DeviceRejectedCommandError, SCPICommandError, or DeviceError is translated to BK8500BRobotError.
  post_error_state: STATE_UNCHANGED
  retry: NEVER_RETRY
  recovery: Drain the error queue, inspect status and capabilities, correct the command sequence, and retry only after state
    verification.
- name: PROTECTION_TRIPPED
  class: SAFETY_TRIP
  meaning: Over-voltage, over-current, over-power, over-temperature, reverse voltage, or another protection is active.
  detection: ProtectionTrippedError or nonzero protection flags are reported.
  post_error_state: SAFE_STATE
  retry: NEVER_RETRY
  recovery: Disable the source and load input, remove the fault cause, inspect diagnostics, then call `Clear Electronic Load
    Protection` while input is OFF.
- name: UNSAFE_OPERATION
  class: STATE_VIOLATION
  meaning: The safety policy blocks the requested hazardous sequence.
  detection: UnsafeOperationError is translated to BK8500BRobotError.
  post_error_state: STATE_UNCHANGED
  retry: NEVER_RETRY
  recovery: Satisfy the documented safety preconditions; do not bypass the policy with raw SCPI.
- name: INDETERMINATE_OUTCOME
  class: COMMUNICATION
  meaning: A state-changing command may have reached the instrument but readback verification failed.
  detection: IndeterminateCommandOutcome is translated with requested operation context.
  post_error_state: STATE_UNDEFINED
  retry: NEVER_RETRY
  recovery: Do not repeat the write blindly. Make the bench safe, call `Synchronize Electronic Load State`, and reconnect
    if state cannot be proven.
- name: ASSERTION_FAILED
  class: CONFIGURATION
  meaning: A measured or queried value does not satisfy the requested oracle.
  detection: AssertionError includes actual value or expected state.
  post_error_state: STATE_UNCHANGED
  retry: SAFE_TO_RETRY
  recovery: Record the failure evidence, verify setup and stabilization, and rerun only when the test procedure allows.
- name: SELF_TEST_FAILED
  class: HARDWARE_FAULT
  meaning: The electronic load built-in self-test returned a nonzero code.
  detection: AssertionError reports the returned self-test code.
  post_error_state: REQUIRES_REINIT
  retry: NEVER_RETRY
  recovery: Disconnect the DUT, power-cycle or service the instrument according to its manual, then repeat identity and health
    checks.
- name: STABILIZATION_TIMEOUT
  class: TRANSIENT
  meaning: The selected measurement did not enter the requested inclusive range before timeout.
  detection: AssertionError reports timeout, measurement type, actual value, and target range.
  post_error_state: STATE_UNCHANGED
  retry: SAFE_TO_RETRY
  recovery: Increase stabilization time only when justified, correct the circuit or limits, and repeat the wait.
- name: INVALID_READING
  class: HARDWARE_FAULT
  meaning: The measurement is malformed, non-finite, or unavailable for the current mode.
  detection: MalformedResponseError or conversion failure is translated to BK8500BRobotError.
  post_error_state: STATE_UNCHANGED
  retry: SAFE_TO_RETRY
  recovery: Check mode, wiring, range, and status; retry the read once, then collect diagnostics.
- name: FILE_IO_ERROR
  class: CONFIGURATION
  meaning: The requested evidence file cannot be created or written.
  detection: OSError or permission failure names the path.
  post_error_state: STATE_UNCHANGED
  retry: NEVER_RETRY
  recovery: Choose a writable path with sufficient storage and repeat the export or logging keyword.
- name: RAW_SCPI_REJECTED
  class: STATE_VIOLATION
  meaning: Raw SCPI violates driver command policy or uses an invalid query/write form.
  detection: BK8500BError reports the blocked raw command.
  post_error_state: STATE_UNCHANGED
  retry: NEVER_RETRY
  recovery: Use a typed keyword or obtain reviewed model-specific authorization for the raw command.
safety:
  dangerous_operations:
  - keyword: Enable Electronic Load Input
    condition: Any connected energized source can deliver unsafe current or power.
    risk_level: HIGH
  - keyword: Configure And Enable Load
    condition: Requested mode or setpoint is incompatible with DUT, wiring, or source rating.
    risk_level: HIGH
  - keyword: Set Short Circuit Mode
    condition: enabled is true.
    risk_level: HIGH
  - keyword: Recall Electronic Load State
    condition: Saved slot contents are not proven safe for the current DUT.
    risk_level: HIGH
  - keyword: Reset Electronic Load
    condition: Reset effects on input and protection state are not independently verified.
    risk_level: HIGH
  - keyword: Write Raw SCPI
    condition: Command changes state or bypasses typed safety semantics.
    risk_level: HIGH
  forbidden_sequences:
  - never:
    - Enable Electronic Load Input
    - Set Current Setpoint
    reason: Reconfiguration must occur with input OFF under the default safety policy.
  - never:
    - Enable Electronic Load Input
    - Set Voltage Setpoint
    reason: Reconfiguration must occur with input OFF under the default safety policy.
  - never:
    - Enable Electronic Load Input
    - Set Power Setpoint
    reason: Reconfiguration must occur with input OFF under the default safety policy.
  - never:
    - Enable Electronic Load Input
    - Set Resistance Setpoint
    reason: Reconfiguration must occur with input OFF under the default safety policy.
  - never:
    - Enable Electronic Load Input
    - Set Electronic Load Mode
    reason: Mode changes while the load is active are prohibited by the default safety policy.
  - never:
    - Set Electronic Load Local
    - Enable Electronic Load Input
    reason: Front-panel changes can invalidate software assumptions; resynchronize and reverify configuration first.
  - never:
    - Write Raw SCPI
    - Enable Electronic Load Input
    reason: Raw writes can stale driver state; synchronize and verify safe configuration first.
  - never:
    - Set Short Circuit Mode
    - Disconnect Electronic Load
    reason: Disable short mode and source energy before disconnecting control.
  required_delays:
  - after: Enable Electronic Load Input
    before: ANY_MEASUREMENT
    min_delay_s: 0.2
  - after: Configure And Enable Load
    before: ANY_MEASUREMENT
    min_delay_s: 0.2
  - after: Reset Electronic Load
    before: ANY_STATE_DEPENDENT_OPERATION
    min_delay_s: 0.5
  - after: Recall Electronic Load State
    before: ANY_STATE_DEPENDENT_OPERATION
    min_delay_s: 0.2
  hardware_limits:
  - model: 8500B
    quantity: input_voltage
    unit: V
    max: 150
  - model: 8500B
    quantity: input_current
    unit: A
    max: 30
  - model: 8500B
    quantity: input_power
    unit: W
    max: 300
  - model: 8502B
    quantity: input_voltage
    unit: V
    max: 500
  - model: 8502B
    quantity: input_current
    unit: A
    max: 15
  - model: 8502B
    quantity: input_power
    unit: W
    max: 300
  - model: 8510B
    quantity: input_voltage
    unit: V
    max: 120
  - model: 8510B
    quantity: input_current
    unit: A
    max: 120
  - model: 8510B
    quantity: input_power
    unit: W
    max: 600
  - model: 8514B
    quantity: input_voltage
    unit: V
    max: 120
  - model: 8514B
    quantity: input_current
    unit: A
    max: 240
  - model: 8514B
    quantity: input_power
    unit: W
    max: 1500
  - model: 8542B
    quantity: input_voltage
    unit: V
    max: 150
  - model: 8542B
    quantity: input_current
    unit: A
    max: 30
  - model: 8542B
    quantity: input_power
    unit: W
    max: 150
  safe_shutdown_sequence:
  - Disable Electronic Load Input
  - Set Short Circuit Mode    enabled=${FALSE}
  - Disconnect All Electronic Loads
  emergency_shutdown: Remove or disable source energy using an independent hardware means, then disable load input, disable
    short mode, capture diagnostics, and disconnect sessions.
verification_objectives:
- id: VO-LOAD-001
  goal: Verify connection identity and model support before energization.
  procedure:
  - Connect To Electronic Load    port=${LOAD_PORT}    alias=load
  - Identify Electronic Load    alias=load
  - Get Electronic Load Capabilities    alias=load
  - Electronic Load Input Should Be Off    alias=load
  oracle:
    type: STATE_QUERY
    measured_by: Electronic Load Input Should Be Off
    expected: PASS
  requires_drivers: []
  risk_level: NONE
  requirements_verified:
  - LOAD-CONNECTION
  - LOAD-IDENTITY
  - LOAD-SAFE-START
- id: VO-LOAD-002
  goal: Verify constant-current loading against an external current reference.
  procedure:
  - ProgrammablePowerSupplyLibrary.Configure Safe Output
  - Set Electronic Load Mode    mode=CC
  - Set Current Protection    amperes=${CURRENT_LIMIT}
  - Set Current Setpoint    amperes=${CURRENT_SETPOINT}
  - Enable Electronic Load Input
  - WAIT stabilization
  - DmmLibrary.Measure DC Current
  - Disable Electronic Load Input
  oracle:
    type: EXTERNAL_REFERENCE
    reference: DmmLibrary current tolerance oracle
    unit: A
    measured_by: DmmLibrary.Measure DC Current
  requires_drivers:
  - ProgrammablePowerSupplyLibrary
  - DmmLibrary
  risk_level: HIGH
  requirements_verified:
  - LOAD-CC-ACCURACY
  - LOAD-SAFE-SHUTDOWN
- id: VO-LOAD-003
  goal: Verify load telemetry remains inside operator-approved voltage, current, and power ranges.
  procedure:
  - Get Measurement Snapshot
  - Voltage Should Be Within Range    minimum=${MIN_V}    maximum=${MAX_V}
  - Current Should Be Within Range    minimum=${MIN_A}    maximum=${MAX_A}
  - Power Should Be Within Range    minimum=${MIN_W}    maximum=${MAX_W}
  oracle:
    type: RANGE
    min: OPERATOR_DEFINED
    max: OPERATOR_DEFINED
    unit: MODE_DEPENDENT
    measured_by: Get Measurement Snapshot
  requires_drivers: []
  risk_level: NONE
  requirements_verified:
  - LOAD-TELEMETRY
- id: VO-LOAD-004
  goal: Verify protection blocks unsafe input enable.
  procedure:
  - Set Current Protection    amperes=${SAFE_LIMIT}
  - Create Controlled Protection Condition
  - Enable Electronic Load Input
  - Get Electronic Load Status
  - Disable Electronic Load Input
  oracle:
    type: STATE_QUERY
    measured_by: Get Electronic Load Status
    expected: NONZERO_PROTECTION_FLAGS_AND_INPUT_OFF
  requires_drivers:
  - ProgrammablePowerSupplyLibrary
  risk_level: HIGH
  requirements_verified:
  - LOAD-PROTECTION
  - LOAD-ROLLBACK
- id: VO-LOAD-005
  goal: Verify finite measurement logging produces the requested number of complete CSV samples.
  procedure:
  - Log Measurements To CSV    path=${CSV_PATH}    samples=${SAMPLES}    interval=${INTERVAL}
  - Validate CSV Rows Externally
  oracle:
    type: EXACT_MATCH
    expected: SAMPLES_COMPLETE_ROWS
    measured_by: HOST_FILESYSTEM_VALIDATOR
  requires_drivers: []
  risk_level: NONE
  requirements_verified:
  - LOAD-EVIDENCE-CSV
test_templates:
- name: Safe Constant Current Load Test
  required_drivers:
  - BK8500BLibrary
  - ProgrammablePowerSupplyLibrary
  - DmmLibrary
  estimated_duration_s: 30
  generated_workflow:
  - Connect and identify all instruments
  - Verify load input OFF
  - Configure source current and voltage limits
  - Configure CC mode, current protection, and setpoint
  - Enable source, then enable load
  - Wait stabilization
  - Measure with DMM and load telemetry
  - Disable load, disable source, disconnect in reverse order
- name: Electronic Load Communication Smoke Test
  required_drivers:
  - BK8500BLibrary
  estimated_duration_s: 10
  generated_workflow:
  - Connect To Electronic Load
  - Identify Electronic Load
  - Run Electronic Load Health Check
  - Get Electronic Load Status
  - Electronic Load Input Should Be Off
  - Disconnect Electronic Load
- name: Long Duration Telemetry Capture
  required_drivers:
  - BK8500BLibrary
  - ProgrammablePowerSupplyLibrary
  estimated_duration_s: UNKNOWN
  generated_workflow:
  - Configure approved safe load
  - Enable source and load
  - Log Measurements To CSV with finite sample count
  - Monitor protections
  - Disable load and source
  - Export Diagnostic Snapshot
setup_teardown:
  suite_setup:
  - Connect To Electronic Load    port=${LOAD_PORT}    alias=${LOAD_ALIAS}
  - Identify Electronic Load    alias=${LOAD_ALIAS}
  - Get Electronic Load Capabilities    alias=${LOAD_ALIAS}
  - Synchronize Electronic Load State    alias=${LOAD_ALIAS}
  - Electronic Load Input Should Be Off    alias=${LOAD_ALIAS}
  suite_teardown:
  - Run Keyword And Ignore Error    Disable Electronic Load Input    alias=${LOAD_ALIAS}
  - Run Keyword And Ignore Error    Set Short Circuit Mode    enabled=${FALSE}    alias=${LOAD_ALIAS}
  - Run Keyword And Ignore Error    Export Diagnostic Snapshot    path=${OUTPUT_DIR}${/}load_diagnostics.json    alias=${LOAD_ALIAS}
  - Run Keyword And Ignore Error    Disconnect All Electronic Loads
  teardown_safe_from_any_state: true
planning_hints:
- Use `Get Electronic Load Capabilities` after connection and enforce exact-model voltage, current, and power limits.
- Treat the load as an energy sink that depends on a separately controlled source; energize the source before enabling load
  only when the wiring path is complete and safe.
- Configure mode, ranges, protections, setpoints, thresholds, and remote sense while input is OFF.
- Use an external calibrated DMM for production accuracy or calibration decisions; load telemetry is primarily operational
  evidence.
- Do not schedule two sessions against the same port or two controllers against the same physical load.
- After raw SCPI, front-panel local control, reset, reconnect, or recall, synchronize state before any hazardous action.
- Always disable load input before disabling the source when source behavior under open circuit is safe; otherwise follow
  the bench-specific emergency sequence.
limitations:
- Real B&K 8500B-series hardware and firmware combinations are not yet HIL-qualified for this package release.
- The public Robot library exposes serial/VISA-compatible port configuration but no Ethernet transport.
- Exact resistance range, slew range, timing limits, and measurement accuracy are model and firmware dependent and require
  the instrument manual or hardware evidence.
- The driver is SUITE scoped and not thread safe; parallel keywords on the same session are unsupported.
- Raw SCPI can bypass typed semantic intent and must be isolated to reviewed debug or model-extension workflows.
- The RFDS-018 system contract shipped with this driver is a conservative template, not a description of an actual wired bench.
unknown_handling:
  literal: UNKNOWN
  open_question_format: BK8500BLibrary.<field_path> is UNKNOWN — required for <affected planning step>.
  conservative_defaults:
    risk_level: HIGH
    idempotency: NON_IDEMPOTENT
    retry: NEVER_RETRY
    blocking: BLOCKING
    max_parallel_sessions: 1
  agent_rule: Never infer an optimistic value for a field carrying UNKNOWN.
conformance:
  schema: ai/rfds017.schema.json
  keyword_surface_source: BK8500BLibrary/library.py explicit @keyword decorators
  lock_file: ai/bk8500b_ai_contract.lock
  validator: scripts/verify_ai_contract.py
  required_checks:
  - SCHEMA_VALID
  - EVERY_PUBLIC_KEYWORD_EXACTLY_ONCE
  - EXACT_SIGNATURE_MATCH
  - ERROR_REFERENCES_RESOLVE
  - STATE_REFERENCES_RESOLVE
  - ORACLES_PRESENT
  - LOCK_MATCHES_PUBLIC_INTERFACE
  contract_status: RFDS_017_V3_CONFORMANT_WITH_PROJECT_LOCAL_SCHEMA
open_questions:
- Exact supported firmware revision ranges are UNKNOWN pending HIL qualification.
- Exact minimum and maximum programmable resistance values per model are UNKNOWN pending manual reconciliation and HIL evidence.
- Exact permissible current-slew ranges per model are UNKNOWN pending manual reconciliation and HIL evidence.
