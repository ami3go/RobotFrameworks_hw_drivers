[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "robotframework-bk8500b"
version = "26.4.0"
description = "Robot Framework library and bundled Python driver for B&K Precision 8500B Series DC electronic loads"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "BK8500B Robot Framework Library Contributors"}]
keywords = [
  "robotframework",
  "bk-precision",
  "electronic-load",
  "scpi",
  "instrumentation",
  "hardware-test-automation",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Framework :: Robot Framework",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Operating System :: Microsoft :: Windows :: Windows 11",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
]
dependencies = [
  "pyserial>=3.5,<4",
  "robotframework>=7.0,<8",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "pytest-cov>=5,<8",
  "build>=1,<2",
  "twine>=5,<7",
  "ruff>=0.6,<1",
  "mypy>=1.11,<2",
  "PyYAML>=6,<7",
  "jsonschema>=4.23,<5",
  "setuptools>=68",
  "wheel",
]
visa = ["pyvisa>=1.14,<2"]

[project.scripts]
bk8500b = "bk8500b.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["bk8500b*", "BK8500BLibrary*"]
exclude = ["tests*"]

[tool.setuptools.data-files]
"share/rf_bk8500b/ai" = [
  "ai/ai_contract.yaml",
  "ai/ai_contract.lock",
  "ai/rfds017.schema.json",
]
"share/rf_bk8500b/bench" = [
  "bench/system_ai_contract.yaml",
  "bench/README.md",
]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
markers = [
  "hardware: requires a real B&K Precision 8500B electronic load",
]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_unused_ignores = true
exclude = ["tests/"]

[tool.coverage.run]
branch = true
source = ["BK8500BLibrary", "bk8500b"]

[tool.coverage.report]
show_missing = true
precision = 2
exclude_also = [
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
]
