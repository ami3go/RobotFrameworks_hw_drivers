name: CI
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest
      - run: robot --outputdir build/robot tests/robot/acceptance.robot
      - run: python -m ruff check .
      - run: python -m build
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: robot-results-${{ matrix.os }}-py${{ matrix.python-version }}
          path: build/robot
