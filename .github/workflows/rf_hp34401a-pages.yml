name: rf_hp34401a Pages

on:
  push:
    branches: [main]
    paths:
      - 'rf_hp34401a/**'
      - '.github/workflows/rf_hp34401a-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: rf-hp34401a-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rf_hp34401a
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install documentation dependencies
        run: >-
          python -m pip install --upgrade pip
          robotframework>=7,<8 jsonschema>=4.20,<5 mkdocs>=1.6 pyyaml>=6.0
      - name: Install driver source without dependency resolution
        run: python -m pip install -e . --no-deps
      - name: Generate Libdoc
        run: python -m robot.libdoc rf_hp34401a.Hp34401ALibrary docs/Hp34401ALibrary.html
      - name: Build Pages artifact
        run: python -m mkdocs build --strict
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: rf_hp34401a/site
      - id: deployment
        uses: actions/deploy-pages@v4
