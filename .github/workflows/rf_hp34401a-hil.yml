name: rf_hp34401a Manual HIL

on:
  workflow_dispatch:
    inputs:
      transport:
        description: VISA or SERIAL
        required: true
        default: VISA
        type: choice
        options: [VISA, SERIAL]

permissions:
  contents: read

jobs:
  hil:
    runs-on: self-hosted
    defaults:
      run:
        working-directory: rf_hp34401a
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install HIL dependencies
        run: >-
          python -m pip install --upgrade pip
          "robotframework>=7,<8" "jsonschema>=4.20,<5"
          "pyvisa>=1.14" "pyserial>=3.5" "pytest>=8" "pyyaml>=6.0"
      - name: Install driver source without dependency resolution
        run: python -m pip install -e . --no-deps
      - name: Require authoritative rfds-core before HIL
        shell: python
        run: |
          import importlib.metadata
          import importlib.util
          import re

          if importlib.util.find_spec('rfds_core') is None:
              raise SystemExit('RFDS-003 BLOCKER: authoritative rfds_core is not installed on the HIL runner')
          version = importlib.metadata.version('rfds-core')
          match = re.match(r'^(\d+)(?:\.(\d+))?', version)
          if not match or int(match.group(1)) != 1:
              raise SystemExit(f'Incompatible rfds-core {version}; expected >=1.0,<2.0')
      - run: python scripts/validate_ai_contract.py
      - run: python scripts/validate_call_protocol_conformance.py
      - run: python scripts/validate_real_hardware_api_suite.py
      - shell: bash
        run: >-
          python -m robot --outputdir results/hil
          --variable TRANSPORT:${{ inputs.transport }}
          --variable VISA_RESOURCE:${{ secrets.HP34401A_VISA_RESOURCE }}
          --variable SERIAL_PORT:${{ secrets.HP34401A_SERIAL_PORT }}
          tests/hil
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hp34401a-hil-evidence-${{ github.sha }}
          path: rf_hp34401a/results/hil
