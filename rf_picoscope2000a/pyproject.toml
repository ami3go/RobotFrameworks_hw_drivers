[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "robotframework-picoscope2000a"
version = "26.1"
description = "Robot Framework driver for the PicoScope 2000A-family (ps2000a) oscilloscopes"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "robotframework>=7.0,<9",
]

[project.optional-dependencies]
hardware = ["picosdk>=1.1"]
plot = ["matplotlib>=3.7"]
dev = [
  "pytest>=8,<10",
  "pytest-cov>=5,<8",
  "ruff>=0.6,<1",
  "mypy>=1.11,<2",
  "build>=1,<2",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["rf_picoscope2000a*", "picoscope2000a*"]
exclude = ["tests*", "examples*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
