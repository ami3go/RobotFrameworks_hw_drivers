device_name: E-Resistor Lab Board 1
host: 192.168.7.50
scpi_port: 5025
http_port: 80
default_timeout_s: 2.0
min_firmware_version: 1.0.0
firmware_check_on_connect: false
shutdown_policy: all_off
state_persistence_file: .eresistor_state.json
safety:
  min_resistance_ohm: 300
  max_resistance_ohm: 20000000
  max_active_bits: 16
  connection_loss_policy: mark_lost_and_alarm
  watchdog_timeout_s: 60
watchdog:
  enabled: true
  keepalive_interval_s: 30
  keepalive_command: SYST:STAT?
  on_fail: reconnect
reconnect:
  max_attempts: null
  backoff_base_s: 1.0
  backoff_max_s: 60.0
  backoff_multiplier: 2.0
  jitter: true
  state_policy: verify_and_hold
calibration:
  auto_download: true
  local_cache_file: calibration_cached.json
  refresh_on_connect: false
  max_age_hours: 168
  validate_on_load: true
  on_stale: warn_and_continue
logging:
  level: INFO
  structured_log: false
