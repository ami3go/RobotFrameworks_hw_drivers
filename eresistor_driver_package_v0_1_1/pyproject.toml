[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "eresistor-driver"
version = "0.1.1"
description = "Python driver for RP2040 W5500 E-Resistor SCPI/HTTP programmable resistor matrix"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "OpenBench / E-Resistor"}]
keywords = ["SCPI", "resistor", "instrument", "RP2040", "W5500", "test automation"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Topic :: System :: Hardware",
]
dependencies = []

[project.optional-dependencies]
yaml = ["PyYAML>=6.0"]
test = ["pytest>=7.0"]
dev = ["pytest>=7.0", "PyYAML>=6.0"]

[project.scripts]
eresistor = "eresistor_driver.cli:main"

[tool.setuptools.packages.find]
include = ["eresistor_driver*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
