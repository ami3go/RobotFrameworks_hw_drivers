[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "robotframework-picoscope-scope"
version = "26.2"
description = "Robot Framework driver for PicoScope oscilloscopes (ps2000a/ps3000a-family, more series planned)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "robotframework>=7.0,<9",
]

[project.optional-dependencies]
hardware = ["picosdk>=1.1"]
plot = ["matplotlib>=3.7"]
dev = [
  "pytest>=8,<10",
  "pytest-cov>=5,<8",
  "ruff>=0.6,<1",
  "mypy>=1.11,<2",
  "build>=1,<2",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["rf_picoscope_scope*", "picoscope_scope*"]
exclude = ["tests*", "examples*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
