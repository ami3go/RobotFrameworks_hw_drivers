name: CI
on: [push, pull_request]
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev]"
      - run: python scripts/validate_ai_contract.py
      - run: python scripts/validate_call_protocol_conformance.py
      - run: python scripts/run_call_protocol_conformance.py
      - run: python -m pytest
      - run: python -m robot --outputdir results tests/robot
      - run: python -m robot --exclude hardware --outputdir results/examples examples
      - run: python -m robot.libdoc rf_hp34401a.Hp34401ALibrary generated/libdoc/Hp34401ALibrary.html
      - run: python -m robot.libdoc rf_hp34401a.Hp34401ALibrary generated/libdoc/Hp34401ALibrary.xml
      - run: python -m mkdocs build --strict
      - run: python -m build
