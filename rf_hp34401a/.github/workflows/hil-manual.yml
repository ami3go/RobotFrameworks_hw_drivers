name: Manual HIL
on:
  workflow_dispatch:
    inputs:
      transport:
        description: VISA or SERIAL
        required: true
        default: VISA
jobs:
  hil:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -e ".[dev,hardware]"
      - run: python scripts/validate_ai_contract.py
      - run: python scripts/validate_call_protocol_conformance.py
      - shell: bash
        run: >-
          python -m robot --outputdir results/hil
          --variable TRANSPORT:${{ inputs.transport }}
          --variable VISA_RESOURCE:${{ secrets.HP34401A_VISA_RESOURCE }}
          --variable SERIAL_PORT:${{ secrets.HP34401A_SERIAL_PORT }}
          tests/hil
      - uses: actions/upload-artifact@v4
        with:
          name: hp34401a-hil-evidence
          path: results/hil
